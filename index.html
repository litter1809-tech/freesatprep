    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
    }

    .sidebar {
      width: 236px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 20;
    }

    .main-stage {
      flex: 1;
      min-width: 0;
      padding: 24px 28px 48px;
      max-width: 1220px;
      margin: 0 auto;
      width: 100%;
    }

    /* Typography & Surfaces */
    .surface-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    .surface-subtle {
      background: var(--content);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .section-kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0;
      color: var(--foreground);
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* Navigation */
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted-foreground);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      text-align: left;
    }
    .nav-btn:hover {
      background: var(--content);
      color: var(--foreground);
    }
    .nav-btn.active {
      background: var(--card);
      color: var(--foreground);
      border-color: var(--card-border);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--foreground);
      transition: opacity 0.14s ease, background 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: var(--content);
      border-color: var(--foreground);
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
      opacity: 0.9;
    }

    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn-lg { padding: 11px 20px; font-size: 14px; border-radius: 9px; }

    /* Pills & Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--content);
      color: var(--muted-foreground);
    }
    .tag-success { color: var(--success); border-color: var(--success); background: transparent; }
    .tag-warning { color: var(--warning); border-color: var(--warning); background: transparent; }
    .tag-error   { color: var(--error);   border-color: var(--error);   background: transparent; }
    .tag-primary { color: var(--primary); border-color: var(--primary); background: transparent; }

    /* Inputs */
    .field-input, .field-select, .field-textarea {
      width: 100%;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.14s ease;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: var(--primary);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab-btn {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.14s ease, border-color 0.14s ease;
    }
    .tab-btn:hover { color: var(--foreground); }
    .tab-btn.active {
      color: var(--foreground);
      border-bottom-color: var(--primary);
    }

    /* Progress Bars */
    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 99px;
      background: var(--content);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    /* Question Choices */
    .choice-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .choice-btn {
      flex: 1;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--foreground);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
      transition: border-color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--foreground);
      background: var(--content);
    }
    .choice-btn.selected {
      border-color: var(--primary);
      background: var(--content);
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    .choice-btn.correct {
      border-color: var(--success);
      box-shadow: inset 0 0 0 1px var(--success);
    }
    .choice-btn.wrong {
      border-color: var(--error);
      box-shadow: inset 0 0 0 1px var(--error);
    }
    .choice-btn.eliminated {
      opacity: 0.4;
      text-decoration: line-through;
    }
    .choice-letter {
      width: 26px;
      height: 26px;
      border-radius: 99px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .choice-btn.selected .choice-letter {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .choice-btn.correct .choice-letter {
      background: var(--success);
      color: var(--primary-foreground);
      border-color: var(--success);
    }
    .choice-btn.wrong .choice-letter {
      background: var(--error);
      color: var(--primary-foreground);
      border-color: var(--error);
    }
    .elim-btn {
      width: 34px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .elim-btn:hover { color: var(--foreground); border-color: var(--foreground); }
    .elim-btn.active { background: var(--content); color: var(--foreground); text-decoration: line-through; }

    /* Reading Passage Styling */
    .passage-box {
      font-size: 15px;
      line-height: 1.72;
      color: var(--foreground);
      user-select: text;
    }
    .passage-box u {
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    mark.hl-yellow { background: rgba(234, 179, 8, 0.32); color: inherit; border-radius: 2px; padding: 0 2px; }
    mark.hl-blue   { background: rgba(59, 130, 246, 0.28); color: inherit; border-radius: 2px; padding: 0 2px; }
    mark.hl-pink   { background: rgba(236, 72, 153, 0.25); color: inherit; border-radius: 2px; padding: 0 2px; }

    /* Bluebook Focus Overlay */
    .exam-overlay {
      position: fixed;
      inset: 0;
      background: var(--background);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .exam-topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .exam-body {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    .exam-pane {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      min-width: 0;
    }
    .exam-pane-split {
      border-right: 1px solid var(--border);
    }
    .exam-bottombar {
      height: 58px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Official Desmos Side Drawer */
    .calc-drawer {
      position: fixed;
      top: 56px;
      right: 0;
      bottom: 0;
      width: 540px;
      max-width: 98vw;
      background: var(--sidebar);
      border-left: 1px solid var(--border);
      z-index: 70;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.16);
      transition: width 0.16s ease;
    }
    .calc-drawer.wide {
      width: 780px;
    }
    .desmos-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #ffffff;
    }

    /* Per-Choice "Why Wrong/Right" Explanation Box */
    .why-box {
      margin: 4px 0 6px 38px;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      line-height: 1.5;
      background: var(--content);
      border: 1px solid var(--border);
      color: var(--foreground);
    }
    .why-box.is-right { border-left: 3px solid var(--success); }
    .why-box.is-wrong { border-left: 3px solid var(--error); }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 720px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 22px 24px;
    }

    /* Data Tables inside SAT Passages */
    .sat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 12px 0;
    }
    .sat-table th, .sat-table td {
      border: 1px solid var(--border);
      padding: 7px 10px;

/* Unified Question Sampler (supports deterministic seeding for Friend Duels & Adaptive Mocks) */
window.SATQuestionEngine = (function(){
  function getCuratedRW(filter = {}) {
    return window.RW_BANK.filter(q => {
      if (filter.domain && filter.domain !== 'all' && q.domain !== filter.domain) return false;
      if (filter.subskill && filter.subskill !== 'all' && q.subskill !== filter.subskill) return false;
      if (filter.difficulty && filter.difficulty !== 'all' && q.difficulty !== filter.difficulty) return false;
      return true;
    });
  }

  function cloneAndShuffle(q, seed) {
    const copy = Object.assign({}, q);
    if (copy.type !== 'spr' && Array.isArray(copy.choices)) {
      const sh = window.SATMathUtils.shuffleChoices(copy.choices, copy.answer, seed, copy.choiceReasons);
      copy.choices = sh.choices;
      copy.answer = sh.answer;
      if (sh.choiceReasons) copy.choiceReasons = sh.choiceReasons;
    }
    return copy;
  }

  function sampleRW(count, filter = {}, seed = 1001, excludeIds = new Set()) {
    const rng = window.SATMathUtils.mulberry32(seed);
    let pool = getCuratedRW(filter).filter(q => !excludeIds.has(q.id));
    if (pool.length < count) {
      // Relax difficulty if needed to satisfy requested length
      const extra = getCuratedRW({ domain: filter.domain, subskill: filter.subskill }).filter(q => !excludeIds.has(q.id) && !pool.some(p => p.id === q.id));
      pool = pool.concat(extra);
    }
    if (pool.length < count) {
      const allExtra = window.RW_BANK.filter(q => !excludeIds.has(q.id) && !pool.some(p => p.id === q.id));
      pool = pool.concat(allExtra);
    }
    // Fisher-Yates shuffle
    const arr = pool.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.slice(0, count).map((q, idx) => cloneAndShuffle(q, seed + idx * 37 + window.SATMathUtils.hashStr(q.id)));
  }

  function sampleMath(count, filter = {}, seed = 2001, excludeIds = new Set()) {
    const rng = window.SATMathUtils.mulberry32(seed);
    const out = [];
    // Gather matching curated elite math
    let curated = window.MATH_CURATED.filter(q => {
      if (excludeIds.has(q.id)) return false;
      if (filter.domain && filter.domain !== 'all' && q.domain !== filter.domain) return false;
      if (filter.subskill && filter.subskill !== 'all' && q.subskill !== filter.subskill) return false;
      if (filter.difficulty && filter.difficulty !== 'all' && q.difficulty !== filter.difficulty) return false;
      return true;
    });
    // Gather matching procedural generators
    let gens = window.MATH_GENERATORS.filter(g => {
      if (filter.domain && filter.domain !== 'all' && g.domain !== filter.domain) return false;
      if (filter.subskill && filter.subskill !== 'all' && g.subskill !== filter.subskill) return false;
      if (filter.difficulty && filter.difficulty !== 'all' && g.difficulty !== filter.difficulty) return false;
      return true;
    });
    if (gens.length === 0) {
      gens = window.MATH_GENERATORS.filter(g => {
        if (filter.domain && filter.domain !== 'all' && g.domain !== filter.domain) return false;
        if (filter.subskill && filter.subskill !== 'all' && g.subskill !== filter.subskill) return false;
        return true;
      });
    }
    if (gens.length === 0) gens = window.MATH_GENERATORS.slice();

    // Shuffle curated
    const cArr = curated.slice();
    for (let i = cArr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [cArr[i], cArr[j]] = [cArr[j], cArr[i]];
    }
    // Mix ~35% curated (if available) + ~65% fresh procedural so every run feels rich & unique
    const curatedQuota = Math.min(cArr.length, Math.max(1, Math.floor(count * 0.38)));
    for (let i = 0; i < curatedQuota && out.length < count; i++) {
      out.push(cloneAndShuffle(cArr[i], seed + i * 53 + window.SATMathUtils.hashStr(cArr[i].id)));
    }
    let step = 0;
    while (out.length < count) {
      const g = gens[(Math.floor(rng() * gens.length) + step) % gens.length];
      const qSeed = (seed * 31 + step * 7919 + window.SATMathUtils.hashStr(g.id)) >>> 0;
      const genQ = g.generate(qSeed);
      out.push(genQ);
      step++;
    }
    // Final shuffle of the combined set
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function buildAdaptiveModule(section, moduleNum, routeHard, seed, excludeIds = new Set()) {
    // Authentic DSAT proportions (compact yet realistic: 18 RW / 16 Math per module in Full Sim, or exact Bluebook lengths!)
    // Let's offer Authentic Full Length (27 RW / 22 Math per module) AND Express Diagnostic!
    const isRW = section === 'rw';
    const total = isRW ? 27 : 22;
    if (moduleNum === 1) {
      // Balanced mix across foundation / target / elite
      const nFound = Math.round(total * 0.30);
      const nTarg  = Math.round(total * 0.45);
      const nElite = total - nFound - nTarg;
      const fn = isRW ? sampleRW : sampleMath;
      const p1 = fn(nFound, { difficulty:'foundation' }, seed + 1, excludeIds);
      p1.forEach(q => excludeIds.add(q.id));
      const p2 = fn(nTarg, { difficulty:'target' }, seed + 2, excludeIds);
      p2.forEach(q => excludeIds.add(q.id));
      const p3 = fn(nElite, { difficulty:'elite' }, seed + 3, excludeIds);
      p3.forEach(q => excludeIds.add(q.id));
      return p1.concat(p2, p3);
    } else {
      const fn = isRW ? sampleRW : sampleMath;
      if (routeHard) {
        // Hard Module 2 (1600 track): 65% elite + 35% target!
        const nElite = Math.round(total * 0.65);
        const nTarg  = total - nElite;
        const p1 = fn(nTarg, { difficulty:'target' }, seed + 10, excludeIds);
        p1.forEach(q => excludeIds.add(q.id));
        const p2 = fn(nElite, { difficulty:'elite' }, seed + 20, excludeIds);
        p2.forEach(q => excludeIds.add(q.id));
        return p1.concat(p2);
      } else {
        // Baseline Module 2: 60% foundation + 40% target
        const nFound = Math.round(total * 0.60);
        const nTarg  = total - nFound;
        const p1 = fn(nFound, { difficulty:'foundation' }, seed + 30, excludeIds);
        p1.forEach(q => excludeIds.add(q.id));
        const p2 = fn(nTarg, { difficulty:'target' }, seed + 40, excludeIds);
        p2.forEach(q => excludeIds.add(q.id));
        return p1.concat(p2);
      }
    }
  }

  function calculateScaledScore(mod1Correct, mod1Total, mod2Correct, mod2Total, routedHard) {
    const r1 = mod1Total ? mod1Correct / mod1Total : 0;
    const r2 = mod2Total ? mod2Correct / mod2Total : 0;
    let raw;
    if (routedHard) {
      // Hard module unlocks 520 → 800; perfect M1 + M2 = 800
      const weighted = 0.42 * r1 + 0.58 * r2;
      raw = 460 + weighted * 340;
      if (mod1Correct === mod1Total && mod2Correct === mod2Total) raw = 800;
    } else {
      // Baseline module caps around 620 (just like real Bluebook DSAT!)
      const weighted = 0.48 * r1 + 0.52 * r2;
      raw = 200 + weighted * 420;
    }
    return Math.min(800, Math.max(200, Math.round(raw / 10) * 10));
  }

  function getChoiceReason(q, idx) {
    if (!q || !Array.isArray(q.choices) || idx < 0 || idx >= q.choices.length) return '';
    if (Array.isArray(q.choiceReasons) && q.choiceReasons[idx]) return q.choiceReasons[idx];
    const ch = String(q.choices[idx]);
    const ans = String(q.choices[q.answer]);
    if (idx === q.answer) {
      const firstLine = String(q.explanation || '').split('\n')[0].trim();
      return `Correct — ${firstLine || `matches the exact result (${ans}).`}`;
    }
    const id = String(q.id || '');
    const U = window.SATMathUtils;
    const chVal = U.parseNumeric(ch.replace(/−/g, '-'));
    const ansVal = U.parseNumeric(ans.replace(/−/g, '-'));

    if (id.startsWith('gen_radical')) {
      if (ch.includes('and')) return 'Wrong — includes the extraneous root! Plugging the smaller root back makes the right side negative, which is impossible for a principal square root.';
      return `Wrong — ${ch} either fails the original square-root equation (extraneous root) or combines both roots instead of keeping only the valid solution (${ans}).`;
    }
    if (id.startsWith('gen_exp_model')) {
      if (ch.includes('+')) return 'Wrong — adds the period to t in the exponent instead of dividing t by the period.';
      if (!ch.includes('/')) return 'Wrong — multiplies t by the period instead of dividing by the period (at t = period, exponent must equal 1).';
      return `Wrong — uses the wrong growth/decay base! Always use (1 + r) for growth and (1 − r) for decay, giving ${ans}.`;
    }
    if (id.startsWith('gen_pct_compound')) {
      if ((ans.includes('increase') && ch.includes('decrease')) || (ans.includes('decrease') && ch.includes('increase'))) {
        return `Wrong — reversed direction! Multiplying the two percent factors yields ${ans}, not ${ch}.`;
      }
      return `Wrong — consecutive percents multiply rather than add/subtract directly; chaining the factors yields ${ans}.`;
    }
    if (id.startsWith('gen_prob_table')) {
      return `Wrong — uses the wrong denominator or subgroup! Conditional probability divides ONLY by the given group total, yielding ${ans}.`;
    }
    if (id.startsWith('gen_arc_sector')) {
      if (ch.includes('π')) return `Wrong — mixes up arc length (2πr) with sector area (πr²) or divides by 180/720 instead of 360; exact value is ${ans}.`;
    }
    if (id.startsWith('gen_trig_comp')) {
      return `Wrong — swaps opposite, adjacent, or hypotenuse relative to angle B! Double-check SOH-CAH-TOA from angle B to get ${ans}.`;
    }
    if (Number.isFinite(chVal) && Number.isFinite(ansVal)) {
      if (Math.abs(chVal + ansVal) < 1e-4 && Math.abs(ansVal) > 1e-4) {
        return `Wrong — sign error! You flipped the sign; the correct value is ${ans}.`;
      }
      if (id.startsWith('gen_circle_cts') && Math.abs(chVal - ansVal * ansVal) < 1e-3) {
        return `Wrong — ${ch} is r², not the radius r! Take the square root to get r = ${ans}.`;
      }
      if (id.startsWith('gen_quad_disc') && Math.abs(chVal - ansVal) === 1) {
        return `Wrong — boundary trap! At ${ch}, the discriminant hits Δ = 0 (exactly 1 solution) instead of the strict inequality required for ${ans}.`;
      }
      if ((id.startsWith('gen_sim_area') || id.startsWith('gen_unit_sq')) && chVal < ansVal) {
        return `Wrong — forgot to SQUARE the linear scale factor! Area scales by k², yielding ${ans} instead of ${ch}.`;
      }
      if ((id.startsWith('gen_sim_area') || id.startsWith('gen_unit_sq')) && chVal > ansVal) {
        return `Wrong — over-scaled (cubed instead of squared, or added an extra term); area scales by k² to give ${ans}.`;
      }
      if (id.startsWith('gen_3d_cyl')) {
        return `Wrong — in V = πr²h, the radius scale factor must be SQUARED while height stays linear, yielding ${ans}.`;
      }
      if (id.startsWith('gen_vertex')) {
        return `Wrong — likely gave the vertex x-coordinate h or y-intercept c instead of the min/max y-value k = ${ans}.`;
      }
      if (id.startsWith('gen_vieta')) {
        return `Wrong — forgot to divide by leading coefficient a or swapped −b/a (sum) with c/a (product); true value is ${ans}.`;
      }
    }
    return `Wrong — evaluates to ${ch} instead of ${ans}. ${q.trapNote || 'Check each algebraic step carefully.'}`;
  }

  return { getCuratedRW, sampleRW, sampleMath, buildAdaptiveModule, calculateScaledScore, getChoiceReason };
})();
</script>

<script>
/* ============================================================================
   MODULE 4: OFFICIAL DESMOS CALCULATOR (DESMOS JS API + POP-OUT FALLBACK)
   ============================================================================ */
window.GraphingCalc = (function(){
  const DESMOS_API_SRC = 'https://www.desmos.com/api/v1.10/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
  const URLS = {
    sat_graph: 'https://www.desmos.com/testing/collegeboard/graphing',
    sat_sci:   'https://www.desmos.com/testing/collegeboard/scientific',
    full:      'https://www.desmos.com/calculator'
  };

  const state = {
    open: false,
    wide: false,
    mode: 'sat_graph', // 'sat_graph' | 'sat_sci' | 'full'
    mounted: false,
    apiStatus: 'idle', // 'idle' | 'loading' | 'ready' | 'blocked'
    graphInst: null,
    sciInst: null,
    suggestedExprs: []
  };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function popOut(mode) {
    const url = URLS[mode || state.mode] || URLS.sat_graph;
    try {
      const w = window.open(url, 'apex_desmos_sat', 'width=640,height=740,resizable=yes,scrollbars=yes');
      if (w && w.focus) { w.focus(); return; }
    } catch {}
    // Fallback anchor click if window.open blocked
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function loadDesmosApi() {
    if (window.Desmos && typeof window.Desmos.GraphingCalculator === 'function') {
      state.apiStatus = 'ready';
      initDesmosWidgets();
      return;
    }
    if (state.apiStatus === 'loading' || state.apiStatus === 'blocked') return;
    state.apiStatus = 'loading';
    renderBodyState();

    const script = document.createElement('script');
    script.src = DESMOS_API_SRC;
    script.async = true;
    let settled = false;

    const fail = () => {
      if (settled) return;
      settled = true;
      state.apiStatus = 'blocked';
      renderBodyState();
    };
    const timer = setTimeout(() => {
      if (!settled && !(window.Desmos && window.Desmos.GraphingCalculator)) fail();
    }, 3200);

    script.onload = () => {
      clearTimeout(timer);
      if (settled) return;
      if (window.Desmos && typeof window.Desmos.GraphingCalculator === 'function') {
        settled = true;
        state.apiStatus = 'ready';
        initDesmosWidgets();
      } else {
        fail();
      }
    };
    script.onerror = () => { clearTimeout(timer); fail(); };
    try {
      (document.head || document.body).appendChild(script);
    } catch {
      clearTimeout(timer);
      fail();
    }
  }

  function initDesmosWidgets() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer || !window.Desmos) return;
    renderBodyState();
    const gEl = drawer.querySelector('#desmos-graph-mount');
    const sEl = drawer.querySelector('#desmos-sci-mount');
    if (gEl && !state.graphInst && typeof window.Desmos.GraphingCalculator === 'function') {
      state.graphInst = window.Desmos.GraphingCalculator(gEl, {
        expressions: true,
        settingsMenu: true,
        zoomButtons: true,
        expressionsTopbar: true,
        border: false,
        notes: false,
        images: false,
        folders: false
      });
    }
    syncModeMounts();
    if (state.suggestedExprs.length) applyExpressionsToDesmos(state.suggestedExprs);
  }

  function toDesmosLatex(expr) {
    let s = String(expr || '').trim();
    if (!s) return '';
    // Convert plain JS-like math strings to clean Desmos LaTeX
    s = s.replace(/sqrt\(([^)]+)\)/g, '\\sqrt{$1}')
         .replace(/abs\(([^)]+)\)/g, '\\left|$1\\right|')
         .replace(/\s*\*\s*/g, '\\cdot ');
    if (!s.includes('=')) s = 'y=' + s;
    return s;
  }

  function applyExpressionsToDesmos(exprList) {
    if (!state.graphInst) return;
    try {
      state.graphInst.setBlank();
      exprList.forEach((ex, i) => {
        const latex = toDesmosLatex(ex);
        if (latex) state.graphInst.setExpression({ id: 'apex_' + i, latex });
      });
      // If any expression uses parameter a or c, initialize slider cleanly
      const joined = exprList.join(' ');
      if (/\ba\b/.test(joined)) state.graphInst.setExpression({ id: 'apex_slider_a', latex: 'a=1' });
      if (/\bc\b/.test(joined)) state.graphInst.setExpression({ id: 'apex_slider_c', latex: 'c=1' });
    } catch {}
  }

  function mountShell() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer) return;
    drawer.innerHTML = `
      <div class="px-4 py-2.5 border-b border-[var(--border)] flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="font-bold text-sm truncate">Desmos Calculator</div>
          <div class="text-xs text-[var(--muted-foreground)] truncate">Official College Board Digital SAT Desmos</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="desmos-clear-btn" class="btn btn-sm hidden" title="Clear graph">Clear</button>
          <button id="desmos-wide-btn" class="btn btn-sm" title="Resize calculator drawer">Wide</button>
          <button id="desmos-popout-btn" class="btn btn-sm" title="Open Desmos in separate window">Pop Out ↗</button>
          <button id="calc-close-btn" class="btn btn-sm">Close</button>
        </div>
      </div>

      <div class="tab-bar px-3">
        <button class="tab-btn active" data-desmos-mode="sat_graph">SAT Graphing</button>
        <button class="tab-btn" data-desmos-mode="sat_sci">SAT Scientific</button>
        <button class="tab-btn" data-desmos-mode="full">Regular Desmos ↗</button>
      </div>

      <div id="desmos-expr-bar" class="hidden px-3 py-2 border-b border-[var(--border)] bg-[var(--content)] text-xs space-y-1">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-[var(--muted-foreground)]">Quick Equations (click to copy or inject into Desmos):</span>
          <button id="desmos-clear-chips" class="text-xs bg-transparent border-0 text-[var(--muted-foreground)] cursor-pointer">Hide</button>
        </div>
        <div id="desmos-expr-chips" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div id="desmos-stage" class="flex-1 min-h-0 relative flex flex-col">
        <div id="desmos-graph-mount" class="flex-1 w-full hidden" style="min-height:420px"></div>
        <div id="desmos-sci-mount" class="flex-1 w-full hidden" style="min-height:420px"></div>
        <div id="desmos-status-panel" class="flex-1 p-5 flex items-center justify-center overflow-y-auto"></div>
      </div>

      <div class="px-3 py-2 border-t border-[var(--border)] bg-[var(--sidebar)] text-xs text-[var(--muted-foreground)] flex items-center justify-between gap-2">
        <span>Tip: Type <code class="font-mono">y1 ~ mx1 + b</code> for regression or add sliders for <code class="font-mono">a, c, k</code>.</span>
        <a id="desmos-direct-link" href="${URLS.sat_graph}" target="_blank" rel="noopener noreferrer" class="font-semibold shrink-0" style="color:var(--primary)">desmos.com ↗</a>
      </div>
    `;

    drawer.querySelector('#calc-close-btn').onclick = () => { state.open = false; syncVisibility(); };
    drawer.querySelector('#desmos-popout-btn').onclick = () => popOut(state.mode);
    drawer.querySelector('#desmos-clear-btn').onclick = () => {
      if (state.graphInst) { try { state.graphInst.setBlank(); } catch {} }
    };
    drawer.querySelector('#desmos-wide-btn').onclick = () => {
      state.wide = !state.wide;
      drawer.classList.toggle('wide', state.wide);
      drawer.querySelector('#desmos-wide-btn').textContent = state.wide ? 'Compact' : 'Wide';
      if (state.graphInst && state.graphInst.resize) state.graphInst.resize();
    };
    drawer.querySelectorAll('[data-desmos-mode]').forEach(btn => {
      btn.onclick = () => {
        const m = btn.dataset.desmosMode;
        if (m === 'full') { popOut('full'); return; }
        switchMode(m);
      };
    });
    drawer.querySelector('#desmos-clear-chips').onclick = () => {
      state.suggestedExprs = [];
      syncExprBar();
    };
    state.mounted = true;
    renderBodyState();
  }

  function renderBodyState() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer) return;
    const gEl = drawer.querySelector('#desmos-graph-mount');
    const sEl = drawer.querySelector('#desmos-sci-mount');
    const stEl = drawer.querySelector('#desmos-status-panel');
    const clrBtn = drawer.querySelector('#desmos-clear-btn');
    if (!stEl) return;

    if (state.apiStatus === 'ready') {
      stEl.classList.add('hidden');
      if (clrBtn) clrBtn.classList.remove('hidden');
      syncModeMounts();
      return;
    }

    if (gEl) gEl.classList.add('hidden');
    if (sEl) sEl.classList.add('hidden');
    if (clrBtn) clrBtn.classList.add('hidden');
    stEl.classList.remove('hidden');

    if (state.apiStatus === 'loading') {
      stEl.innerHTML = `
        <div class="text-center space-y-2 max-w-sm">
          <div class="font-bold text-sm">Loading Official Desmos Calculator…</div>
          <div class="text-xs text-[var(--muted-foreground)]">Connecting to Desmos Graphing &amp; Scientific API.</div>
        </div>
      `;
    } else {
      stEl.innerHTML = `
        <div class="surface-card p-5 space-y-4 max-w-md w-full">
          <div class="space-y-1">
            <div class="section-kicker">Official Desmos Launcher</div>
            <div class="font-bold text-base">Open Official Desmos Calculator</div>
            <p class="text-xs text-[var(--muted-foreground)] m-0 leading-relaxed">
              This preview pane's security sandbox blocks external scripts from loading inline. Launch the real official College Board SAT Desmos in a pop-out window below—or open the standalone <code class="font-mono">SAT_1600_Studio.html</code> file in Chrome/Safari to have live Desmos embedded directly inside this drawer!
            </p>
          </div>
          <div class="space-y-2">
            <a href="${URLS.sat_graph}" target="_blank" rel="noopener noreferrer" class="btn btn-primary w-full" style="text-decoration:none">
              Open Official SAT Graphing Desmos ↗
            </a>
            <a href="${URLS.sat_sci}" target="_blank" rel="noopener noreferrer" class="btn w-full" style="text-decoration:none">
              Open Official SAT Scientific Desmos ↗
            </a>
            <a href="${URLS.full}" target="_blank" rel="noopener noreferrer" class="btn w-full" style="text-decoration:none">
              Open Regular Desmos Graphing Calculator ↗
            </a>
          </div>
          <div class="pt-2 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
            <span>On a normal browser with Wi-Fi?</span>
            <button id="desmos-retry-btn" class="btn btn-sm">Retry Inline Embed</button>
          </div>
        </div>
      `;
      const retry = stEl.querySelector('#desmos-retry-btn');
      if (retry) retry.onclick = () => { state.apiStatus = 'idle'; loadDesmosApi(); };
    }
  }

  function syncModeMounts() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer || state.apiStatus !== 'ready') return;
    const gEl = drawer.querySelector('#desmos-graph-mount');
    const sEl = drawer.querySelector('#desmos-sci-mount');
    const isSci = state.mode === 'sat_sci';
    if (gEl) gEl.classList.toggle('hidden', isSci);
    if (sEl) sEl.classList.toggle('hidden', !isSci);
    if (isSci) {
      if (sEl && !state.sciInst && window.Desmos && typeof window.Desmos.ScientificCalculator === 'function') {
        state.sciInst = window.Desmos.ScientificCalculator(sEl, { border: false });
      }
      if (state.sciInst && state.sciInst.resize) state.sciInst.resize();
    } else {
      if (state.graphInst && state.graphInst.resize) state.graphInst.resize();
    }
  }

  function switchMode(mode) {
    if (!URLS[mode]) return;
    state.mode = mode;
    const drawer = document.getElementById('calc-drawer');
    if (!drawer) return;
    const direct = drawer.querySelector('#desmos-direct-link');
    if (direct) direct.href = URLS[mode];
    drawer.querySelectorAll('[data-desmos-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.desmosMode === mode);
    });
    syncModeMounts();
  }

  function syncExprBar() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer) return;
    const bar = drawer.querySelector('#desmos-expr-bar');
    const chips = drawer.querySelector('#desmos-expr-chips');
    if (!bar || !chips) return;
    if (!state.suggestedExprs.length) {
      bar.classList.add('hidden');
      return;
    }
    bar.classList.remove('hidden');
    chips.innerHTML = state.suggestedExprs.map((ex, i) => `
      <button class="btn btn-sm font-mono py-0.5 px-2" data-copy-expr="${i}" title="Click to copy for Desmos">${esc(ex.includes('=') ? ex : 'y = ' + ex)}</button>
    `).join('');
    chips.querySelectorAll('[data-copy-expr]').forEach(btn => {
      btn.onclick = () => {
        const raw = state.suggestedExprs[Number(btn.dataset.copyExpr)];
        const expr = raw.includes('=') ? raw : 'y = ' + raw;
        if (state.graphInst) {
          try { state.graphInst.setExpression({ id: 'apex_pick_' + Date.now(), latex: toDesmosLatex(raw) }); } catch {}
        }
        if (window.ExamRunner && window.ExamRunner.copyToClipboard) {
          window.ExamRunner.copyToClipboard(expr, state.graphInst ? `Added & copied "${expr}"!` : `Copied "${expr}" — paste into Desmos (Ctrl/Cmd+V)!`);
        }
      };
    });
  }

  function syncVisibility() {
    const drawer = document.getElementById('calc-drawer');
    if (!drawer) return;
    if (state.open) {
      if (!state.mounted) mountShell();
      drawer.classList.remove('hidden');
      drawer.classList.toggle('wide', state.wide);
      syncExprBar();
      loadDesmosApi();
    } else {
      drawer.classList.add('hidden');
    }
  }

  function open(mode) {
    state.open = true;
    syncVisibility();
    if (mode === 'sci' || mode === 'sat_sci') switchMode('sat_sci');
    else if (mode === 'full') popOut('full');
    else switchMode('sat_graph');
  }

  function toggle() {
    state.open = !state.open;
    syncVisibility();
  }

  function loadExpressions(exprList) {
    state.suggestedExprs = (Array.isArray(exprList) ? exprList : []).filter(Boolean);
    state.open = true;
    syncVisibility();
    switchMode('sat_graph');
    syncExprBar();
    if (state.apiStatus === 'ready') applyExpressionsToDesmos(state.suggestedExprs);
  }

  return { open, toggle, loadExpressions, popOut, getUrl: () => URLS[state.mode], draw: () => {} };
})();
window.DesmosDrawer = window.GraphingCalc;
</script>

<script>
/* ============================================================================
   MODULE 5A: STATE STORE, SCORING ENGINE, SM-2 SRS, STUDY PLAN & DUEL CODECS
   ============================================================================ */
window.ApexStore = (function(){
  const STORAGE_KEY = 'apex_sat_1600_v1';
  const SLOTS_KEY = 'apex_sat_1600_slots_v1';

  let storageAvailable = checkStorage();
  let lastSavedAt = null;
  let memorySlots = [null, null, null];

  function checkStorage() {
    try {
      const k = '__apex_test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch {
      return false;
    }
  }

  function defaultState() {
    const today = new Date().toISOString().slice(0, 10);
    const examDate = new Date(Date.now() + 70 * 86400000).toISOString().slice(0, 10);
    return {
      version: 2,
      lastSaved: null,
      profile: {
        name: 'Scholar',
        currentRW: 640,
        currentMath: 660,
        targetScore: 1600,
        examDate,
        dailyMinutes: 45,
        onboarded: false
      },
      streak: { count: 1, lastActive: today },
      stats: {
        totalSolved: 0,
        totalCorrect: 0,
        domains: {}
      },
      exams: [],        // { id, date, mode, rwScore, mathScore, totalScore, rwHard, mathHard, accuracy, durationSec }
      mistakes: [],     // { key, question, wrongCount, rootCause, note, intervalDays, nextDue, streakRight, lastMissed }
      vocabSrs: {},     // wordId -> { box: 0..4, nextDue }
      planDone: {},     // 'YYYY-MM-DD:taskId' -> true
      duels: [],        // { id, date, code, opponent, myScore, oppScore, total, mySec, oppSec, title }
      squad: [],        // { name, projected, bestMock, streak, solved, updated }
      activeExam: null, // serialized mid-exam checkpoint so users can pause & resume anytime
      activeDrill: null // serialized mid-drill checkpoint so users can pause & resume anytime
    };
  }

  let data = load();

  function hydrate(parsed) {
    const def = defaultState();
    return Object.assign(def, parsed || {}, {
      profile: Object.assign(def.profile, (parsed && parsed.profile) || {}),
      streak: Object.assign(def.streak, (parsed && parsed.streak) || {}),
      stats: Object.assign(def.stats, (parsed && parsed.stats) || {})
    });
  }

  function load() {
    if (!storageAvailable) return defaultState();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      lastSavedAt = parsed.lastSaved || Date.now();
      return hydrate(parsed);
    } catch {
      return defaultState();
    }
  }

  function save() {
    const today = new Date().toISOString().slice(0, 10);
    if (data.streak.lastActive !== today) {
      const diff = Math.round((new Date(today) - new Date(data.streak.lastActive)) / 86400000);
      data.streak.count = diff === 1 ? data.streak.count + 1 : 1;
      data.streak.lastActive = today;
    }
    lastSavedAt = Date.now();
    data.lastSaved = lastSavedAt;
    if (storageAvailable) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch {
        // Fallback if quota exceeded: trim old highlights from checkpoint and retry
        try {
          if (data.activeExam && data.activeExam.highlights) data.activeExam.highlights = {};
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch {}
      }
    }
    notifySaveIndicator();
  }

  function notifySaveIndicator() {
    const el = document.getElementById('sidebar-save-status');
    if (!el) return;
    if (!storageAvailable) {
      el.textContent = 'Use Save Code';
      el.style.color = 'var(--warning)';
    } else if (lastSavedAt) {
      const d = new Date(lastSavedAt);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      el.textContent = `Saved ${hh}:${mm}`;
      el.style.color = 'var(--success)';
    } else {
      el.textContent = 'Auto-save on';
    }
  }

  function saveActiveExam(snapshot) {
    data.activeExam = snapshot;
    save();
  }
  function clearActiveExam() {
    if (data.activeExam !== null) {
      data.activeExam = null;
      save();
    }
  }
  function saveActiveDrill(snapshot) {
    data.activeDrill = snapshot;
    save();
  }
  function clearActiveDrill() {
    if (data.activeDrill !== null) {
      data.activeDrill = null;
      save();
    }
  }

  function loadSlots() {
    if (!storageAvailable) return memorySlots;
    try {
      const raw = localStorage.getItem(SLOTS_KEY);
      if (!raw) return [null, null, null];
      const arr = JSON.parse(raw);
      return [arr[0] || null, arr[1] || null, arr[2] || null];
    } catch {
      return [null, null, null];
    }
  }
  function persistSlots(slots) {
    memorySlots = slots;
    if (storageAvailable) {
      try { localStorage.setItem(SLOTS_KEY, JSON.stringify(slots)); } catch {}
    }
  }
  function listSlots() {
    return loadSlots().map((s, idx) => s ? {
      idx,
      label: s.label,
      savedAt: s.savedAt,
      name: s.data.profile ? s.data.profile.name : 'Scholar',
      solved: s.data.stats ? s.data.stats.totalSolved : 0,
      projected: s.projected || 1300
    } : null);
  }
  function saveToSlot(slotIdx, label) {
    const slots = loadSlots();
    const sc = getProjectedScores();
    slots[slotIdx] = {
      label: (label || '').trim() || `${data.profile.name} (${sc.total})`,
      savedAt: Date.now(),
      projected: sc.total,
      data: JSON.parse(JSON.stringify(data))
    };
    persistSlots(slots);
    save();
  }
  function loadFromSlot(slotIdx) {
    const slots = loadSlots();
    if (!slots[slotIdx] || !slots[slotIdx].data) throw new Error('Save slot is empty');
    data = hydrate(JSON.parse(JSON.stringify(slots[slotIdx].data)));
    save();
  }
  function deleteSlot(slotIdx) {
    const slots = loadSlots();
    slots[slotIdx] = null;
    persistSlots(slots);
  }

  function recordAttempt(q, isCorrect, elapsedSec, wasFlagged) {
    data.stats.totalSolved++;
    if (isCorrect) data.stats.totalCorrect++;
    const dom = data.stats.domains[q.domain] || { attempts: 0, correct: 0, totalSec: 0 };
    dom.attempts++;
    if (isCorrect) dom.correct++;
    dom.totalSec += Math.min(300, Math.max(2, elapsedSec || 30));
    data.stats.domains[q.domain] = dom;

    if (!isCorrect || wasFlagged) {
      addOrUpdateMistake(q, !isCorrect);
    }
    save();
  }

  function addOrUpdateMistake(q, wasWrong) {
    const existing = data.mistakes.find(m => m.key === q.id);
    const now = Date.now();
    if (existing) {
      if (wasWrong) {
        existing.wrongCount++;
        existing.intervalDays = 0;
        existing.streakRight = 0;
        existing.nextDue = now;
        existing.lastMissed = now;
      }
    } else {
      data.mistakes.unshift({
        key: q.id,
        question: q,
        wrongCount: wasWrong ? 1 : 0,
        rootCause: wasWrong ? 'concept' : 'trap',
        note: '',
        intervalDays: 0,
        nextDue: now,
        streakRight: 0,
        lastMissed: now
      });
      if (data.mistakes.length > 200) data.mistakes.pop();
    }
    save();
  }

  function reviewMistake(key, gotRight) {
    const m = data.mistakes.find(x => x.key === key);
    if (!m) return;
    const now = Date.now();
    if (gotRight) {
      m.streakRight = (m.streakRight || 0) + 1;
      const schedule = [1, 3, 7, 16, 30];
      const days = schedule[Math.min(schedule.length - 1, m.streakRight - 1)];
      m.intervalDays = days;
      m.nextDue = now + days * 86400000;
    } else {
      m.streakRight = 0;
      m.intervalDays = 0;
      m.nextDue = now;
      m.wrongCount++;
    }
    save();
  }

  function getDueMistakes() {
    const now = Date.now();
    return data.mistakes.filter(m => m.streakRight < 4 && (m.nextDue || 0) <= now);
  }

  function getProjectedScores() {
    // Blend latest full/section mock exams with live domain accuracy & baseline profile
    const rwDoms = window.SAT_DOMAINS.rw;
    const mathDoms = window.SAT_DOMAINS.math;

    const estSection = (doms, baseline, examField) => {
      const recentExams = data.exams.filter(e => typeof e[examField] === 'number').slice(-3);
      let examAvg = recentExams.length ? recentExams.reduce((s, e) => s + e[examField], 0) / recentExams.length : null;
      let weightedAcc = 0, weightSum = 0, totalAtt = 0;
      doms.forEach(d => {
        const st = data.stats.domains[d.id];
        if (st && st.attempts > 0) {
          weightedAcc += (st.correct / st.attempts) * d.weight;
          weightSum += d.weight;
          totalAtt += st.attempts;
        }
      });
      let drillScore = weightSum > 0 ? (340 + (weightedAcc / weightSum) * 460) : baseline;
      let combined;
      if (examAvg !== null && totalAtt >= 8) combined = 0.65 * examAvg + 0.35 * drillScore;
      else if (examAvg !== null) combined = examAvg;
      else if (totalAtt >= 6) {
        const blend = Math.min(0.75, totalAtt / 30);
        combined = baseline * (1 - blend) + drillScore * blend;
      } else {
        combined = baseline;
      }
      return Math.min(800, Math.max(200, Math.round(combined / 10) * 10));
    };

    const rw = estSection(rwDoms, data.profile.currentRW || 640, 'rwScore');
    const math = estSection(mathDoms, data.profile.currentMath || 660, 'mathScore');
    return { rw, math, total: rw + math };
  }

  function getDomainMastery(domainObj) {
    const st = data.stats.domains[domainObj.id] || { attempts: 0, correct: 0, totalSec: 0 };
    const acc = st.attempts ? Math.round((st.correct / st.attempts) * 100) : null;
    const avgSec = st.attempts ? Math.round(st.totalSec / st.attempts) : null;
    let tier = 'Unassessed';
    if (st.attempts >= 3) {
      if (acc >= 92 && avgSec <= domainObj.targetSec * 1.1) tier = '1600 Lock';
      else if (acc >= 82) tier = '1500+ Tier';
      else if (acc >= 68) tier = 'Contender';
      else tier = 'Priority Gap';
    } else if (st.attempts > 0) {
      tier = 'Calibrating';
    }
    const maxPts = Math.round(600 * domainObj.weight);
    const estGain = acc === null ? Math.round(maxPts * 0.25) : Math.round(((100 - acc) / 100) * maxPts * 0.65);
    return { attempts: st.attempts, correct: st.correct, acc, avgSec, tier, estGain };
  }

  function generateDailyProtocol() {
    const today = new Date().toISOString().slice(0, 10);
    const dueM = getDueMistakes().length;
    const dueV = window.VOCAB_BANK.filter(v => {
      const s = data.vocabSrs[v.id];
      return !s || (s.nextDue || 0) <= Date.now();
    }).length;

    const allRW = window.SAT_DOMAINS.rw.map(d => ({ d, m: getDomainMastery(d) }))
      .sort((a, b) => (a.m.acc ?? 55) - (b.m.acc ?? 55));
    const allMath = window.SAT_DOMAINS.math.map(d => ({ d, m: getDomainMastery(d) }))
      .sort((a, b) => (a.m.acc ?? 55) - (b.m.acc ?? 55));

    const weakRW = allRW[0].d;
    const weakMath = allMath[0].d;
    const mins = data.profile.dailyMinutes || 45;

    const tasks = [
      {
        id: 't_mistakes',
        title: dueM > 0 ? `Clear ${Math.min(8, dueM)} Due Mistake Vault Cards` : 'Log & Audit Your Mistake Vault',
        meta: dueM > 0 ? 'SM-2 Spaced Repetition · Highest ROI' : 'Keep Mistake Vault at Zero Inbox',
        minutes: 8,
        action: { type: 'view', view: 'mistakes' }
      },
      {
        id: 't_math',
        title: `1600 Target Drill: ${weakMath.name}`,
        meta: `8 questions · ${allMath[0].m.acc !== null ? allMath[0].m.acc + '% accuracy' : 'Calibrating'} · Desmos + Algebra`,
        minutes: Math.round(mins * 0.35),
        action: { type: 'drill', section: 'math', domain: weakMath.id, count: 8, difficulty: 'all' }
      },
      {
        id: 't_rw',
        title: `Precision RW Sprint: ${weakRW.name}`,
        meta: `8 questions · ${allRW[0].m.acc !== null ? allRW[0].m.acc + '% accuracy' : 'Calibrating'} · Trap Elimination`,
        minutes: Math.round(mins * 0.30),
        action: { type: 'drill', section: 'rw', domain: weakRW.id, count: 8, difficulty: 'all' }
      },
      {
        id: 't_vocab',
        title: `Precision Vocab SRS (${Math.min(12, dueV)} cards due)`,
        meta: 'High-frequency Digital SAT Words-in-Context',
        minutes: 6,
        action: { type: 'view', view: 'playbooks', subtab: 'vocab' }
      }
    ];
    if (mins >= 60) {
      tasks.push({
        id: 't_boss',
        title: '1600 Hard Module 2 Mini-Gauntlet',
        meta: '10 pure 750–800 ceiling questions under pacing clock',
        minutes: 15,
        action: { type: 'exam', mode: 'boss' }
      });
    }
    return tasks.map(t => Object.assign({}, t, { done: !!data.planDone[`${today}:${t.id}`], key: `${today}:${t.id}` }));
  }

  function encodeBase64(obj) {
    const json = JSON.stringify(obj);
    return btoa(unescape(encodeURIComponent(json)));
  }
  function decodeBase64(str) {
    const json = decodeURIComponent(escape(atob(str.trim())));
    return JSON.parse(json);
  }

  function makeSaveCode() {
    save();
    return 'APEXSAVE:' + encodeBase64(data);
  }
  function restoreSaveCode(code) {
    const cleaned = String(code || '').trim();
    let parsed;
    if (cleaned.startsWith('APEXSAVE:')) {
      parsed = decodeBase64(cleaned.slice(9));
    } else if (cleaned.startsWith('{')) {
      parsed = JSON.parse(cleaned);
    } else {
      throw new Error('Save code must start with APEXSAVE: (or be valid backup JSON)');
    }
    if (!parsed || !parsed.profile || !parsed.stats) throw new Error('Invalid or incomplete save data');
    data = hydrate(parsed);
    save();
    return data;
  }

  function makePlayerCardCode() {
    const sc = getProjectedScores();
    const bestMock = data.exams.length ? Math.max(...data.exams.map(e => e.totalScore || 0)) : 0;
    return 'APEXCARD:' + encodeBase64({
      n: data.profile.name || 'Scholar',
      p: sc.total,
      rw: sc.rw,
      m: sc.math,
      b: bestMock,
      s: data.streak.count,
      q: data.stats.totalSolved,
      u: new Date().toISOString().slice(0, 10)
    });
  }

  function parsePlayerCardCode(code) {
    const cleaned = String(code || '').trim();
    if (!cleaned.startsWith('APEXCARD:')) throw new Error('Invalid Player Card code (must start with APEXCARD:)');
    const obj = decodeBase64(cleaned.slice(9));
    if (!obj || typeof obj.n !== 'string' || typeof obj.p !== 'number') throw new Error('Corrupted Player Card data');
    return { name: obj.n, projected: obj.p, rw: obj.rw || 0, math: obj.m || 0, bestMock: obj.b || 0, streak: obj.s || 0, solved: obj.q || 0, updated: obj.u || '' };
  }

  function makeChallengeCode(payload) {
    return 'APEXDUEL:' + encodeBase64(payload);
  }
  function parseChallengeCode(code) {
    const cleaned = String(code || '').trim();
    if (!cleaned.startsWith('APEXDUEL:')) throw new Error('Challenge code must start with APEXDUEL:');
    const obj = decodeBase64(cleaned.slice(9));
    if (!obj || !obj.seed || !obj.mode || !obj.count) throw new Error('Invalid challenge payload');
    return obj;
  }

  return {
    get: () => data,
    set: (newData) => { data = hydrate(newData); save(); },
    reset: () => { data = defaultState(); save(); },
    isStorageAvailable: () => storageAvailable,
    getLastSavedAt: () => lastSavedAt,
    notifySaveIndicator,
    save, recordAttempt, addOrUpdateMistake, reviewMistake, getDueMistakes,
    saveActiveExam, clearActiveExam, saveActiveDrill, clearActiveDrill,
    listSlots, saveToSlot, loadFromSlot, deleteSlot,
    makeSaveCode, restoreSaveCode,
    getProjectedScores, getDomainMastery, generateDailyProtocol,
    encodeBase64, decodeBase64, makePlayerCardCode, parsePlayerCardCode,
    makeChallengeCode, parseChallengeCode
  };
})();

/* ============================================================================
   SHARED UI HELPERS & SAT CONTENT RENDERERS
   ============================================================================ */
window.ApexUI = (function(){
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderPassageHTML(q) {
    let html = '';
    if (q.table) {
      html += `<div class="mb-3">
        ${q.table.caption ? `<div class="text-xs font-semibold text-[var(--muted-foreground)] mb-1">${esc(q.table.caption)}</div>` : ''}
        <table class="sat-table">
          <thead><tr>${q.table.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${q.table.rows.map(r => `<tr>${r.map(c => `<td class="tabular">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>`;
    }
    if (q.chart) {
      html += `<div class="mb-3 p-3 surface-subtle">
        <div class="text-xs font-semibold mb-2.5">${esc(q.chart.title)}</div>
        <div class="space-y-2">
          ${q.chart.bars.map(b => {
            const pct = Math.min(100, Math.round((b.value / b.max) * 100));
            return `<div class="text-xs">
              <div class="flex justify-between mb-0.5"><span>${esc(b.label)}</span><span class="font-mono font-semibold tabular">${b.value}</span></div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }
    if (q.svg) {
      html += `<div class="mb-3 p-2 surface-subtle">${q.svg}</div>`;
    }
    if (q.text1 && q.text2) {
      html += `<div class="space-y-3 passage-box">
        <div><div class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1">Text 1</div><p class="m-0">${formatPassageText(q.text1)}</p></div>
        <div class="pt-3 border-t border-[var(--border)]"><div class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1">Text 2</div><p class="m-0">${formatPassageText(q.text2)}</p></div>
      </div>`;
    } else if (q.notes) {
      html += `<div class="passage-box">
        <div class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-2">While researching a topic, a student has taken the following notes:</div>
        <ul class="list-disc pl-5 space-y-1.5 m-0">${q.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      </div>`;
    } else if (q.passage) {
      html += `<div class="passage-box">${formatPassageText(q.passage)}</div>`;
    }
    return html;
  }

  function formatPassageText(raw) {
    // Preserve intentional <u>...</u> markup from curated Text Structure questions while escaping everything else safely
    return esc(raw)
      .replace(/&lt;u&gt;/g, '<u>')
      .replace(/&lt;\/u&gt;/g, '</u>')
      .replace(/\n/g, '<br>');
  }

  function formatTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60), r = s % 60;
    return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  }

  function toast(msg) {
    const el = document.getElementById('toast-box');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('hidden'), 2600);
  }

  function openModal(title, bodyHtml, onBind) {
    const root = document.getElementById('modal-root');
    if (!root) return;
    root.innerHTML = `
      <div class="modal-panel" role="dialog" aria-modal="true">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-[var(--border)]">
          <h3 class="text-base font-bold m-0">${esc(title)}</h3>
          <button id="modal-close-x" class="btn btn-sm">Close</button>
        </div>
        <div id="modal-body">${bodyHtml}</div>
      </div>
    `;
    root.classList.remove('hidden');
    const close = () => root.classList.add('hidden');
    root.querySelector('#modal-close-x').onclick = close;
    root.onclick = (e) => { if (e.target === root) close(); };
    if (onBind) onBind(root, close);
  }

  function openReferenceSheet() {
    openModal('Official Digital SAT Math Reference Sheet', `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div class="surface-subtle p-3">
          <div class="font-bold mb-1">Circle</div>
          <div class="font-mono">A = πr² &nbsp;·&nbsp; C = 2πr</div>
          <div class="text-[var(--muted-foreground)] mt-1">360° = 2π radians · Arc = (θ/360)·2πr</div>
        </div>
        <div class="surface-subtle p-3">
          <div class="font-bold mb-1">Rectangle &amp; Triangle</div>
          <div class="font-mono">A = lw &nbsp;·&nbsp; A = ½bh &nbsp;·&nbsp; a² + b² = c²</div>
          <div class="text-[var(--muted-foreground)] mt-1">Sum of angles in any triangle = 180°</div>
        </div>
        <div class="surface-subtle p-3">
          <div class="font-bold mb-1">Special Right Triangles</div>
          <div class="font-mono">30°–60°–90°: &nbsp; x : x√3 : 2x</div>
          <div class="font-mono mt-1">45°–45°–90°: &nbsp; x : x : x√2</div>
        </div>
        <div class="surface-subtle p-3">
          <div class="font-bold mb-1">3D Volumes</div>
          <div class="font-mono">Prism: V = lwh &nbsp;·&nbsp; Cylinder: V = πr²h</div>
          <div class="font-mono mt-1">Sphere: V = ⁴⁄₃πr³ &nbsp;·&nbsp; Cone: V = ⅓πr²h</div>
          <div class="font-mono mt-1">Pyramid: V = ⅓lwh</div>
        </div>
        <div class="surface-subtle p-3 sm:col-span-2">
          <div class="font-bold mb-1">1600 Bonus Formulas (Not Printed on Official Sheet — Memorize!)</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 font-mono mt-1">
            <div>Vertex x = −b / (2a)</div>
            <div>Discriminant Δ = b² − 4ac</div>
            <div>Sum of roots = −b / a</div>
            <div>Product of roots = c / a</div>
            <div>Circle: (x−h)² + (y−k)² = r²</div>
            <div>sin(x°) = cos(90° − x°)</div>
          </div>
        </div>
      </div>
    `);
  }

  function renderReviewedChoices(q, userAns, uid = 'rc') {
    const letters = ['A', 'B', 'C', 'D'];
    return `
      <div class="space-y-2" data-why-group="${esc(uid)}">
        <div class="flex items-center justify-between gap-2 text-xs">
          <span class="text-[var(--muted-foreground)]">Click <strong>Why?</strong> on any answer to see clearly why it is right or wrong:</span>
          <button type="button" class="btn btn-sm" data-why-all="${esc(uid)}">Show All Explanations</button>
        </div>
        ${q.choices.map((ch, ci) => {
          const isRight = ci === q.answer;
          const isMine = ci === userAns;
          const reason = window.SATQuestionEngine.getChoiceReason(q, ci);
          // Auto-open the user's wrong choice so they see immediately why it missed
          const openInit = isMine && !isRight;
          return `
            <div>
              <div class="choice-row">
                <div class="choice-btn cursor-default ${isRight ? 'correct' : (isMine ? 'wrong' : '')}">
                  <span class="choice-letter">${letters[ci]}</span>
                  <span class="flex-1">${esc(ch)}</span>
                  ${isRight ? '<span class="tag tag-success shrink-0">Correct</span>' : isMine ? '<span class="tag tag-error shrink-0">Your Pick</span>' : ''}
                </div>
                <button type="button" class="btn btn-sm shrink-0" data-why-toggle="${esc(uid)}_${ci}" aria-expanded="${openInit ? 'true' : 'false'}" title="Explain why this choice is ${isRight ? 'correct' : 'wrong'}">
                  ${isRight ? 'Why right?' : 'Why wrong?'}
                </button>
              </div>
              <div id="why_box_${esc(uid)}_${ci}" class="why-box ${isRight ? 'is-right' : 'is-wrong'} ${openInit ? '' : 'hidden'}">
                ${esc(reason)}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function bindReviewedChoices(root) {
    if (!root) return;
    root.querySelectorAll('[data-why-toggle]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.whyToggle;
        const box = root.querySelector('#why_box_' + key);
        if (!box) return;
        const nowHidden = box.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', nowHidden ? 'false' : 'true');
      };
    });
    root.querySelectorAll('[data-why-all]').forEach(btn => {
      btn.onclick = () => {
        const uid = btn.dataset.whyAll;
        const group = root.querySelector(`[data-why-group="${uid}"]`);
        if (!group) return;
        const boxes = Array.from(group.querySelectorAll('.why-box'));
        const anyHidden = boxes.some(b => b.classList.contains('hidden'));
        boxes.forEach(b => b.classList.toggle('hidden', !anyHidden));
        btn.textContent = anyHidden ? 'Hide All Explanations' : 'Show All Explanations';
      };
    });
  }

  return { esc, renderPassageHTML, formatPassageText, formatTime, toast, openModal, openReferenceSheet, renderReviewedChoices, bindReviewedChoices };
})();
</script>

<script>
/* ============================================================================
   MODULE 5B: FULL-SCREEN BLUEBOOK ADAPTIVE EXAM & FRIEND DUEL ENGINE
   ============================================================================ */
window.ExamRunner = (function(){
  let sess = null;
  let timerId = null;

  function start(mode, opts = {}) {
    const seed = opts.seed || (Math.floor(Date.now() % 1000000) + Math.floor(Math.random() * 9000));
    const exclude = new Set();
    let stages = [];

    if (mode === 'full') {
      stages = [
        { section: 'rw', mod: 1, title: 'Reading & Writing · Module 1', mins: 32, count: 27 },
        { section: 'rw', mod: 2, title: 'Reading & Writing · Module 2', mins: 32, count: 27, adaptive: true },
        { section: 'break', title: '10-Minute Intermission', mins: 10 },
        { section: 'math', mod: 1, title: 'Math · Module 1', mins: 35, count: 22 },
        { section: 'math', mod: 2, title: 'Math · Module 2', mins: 35, count: 22, adaptive: true }
      ];
    } else if (mode === 'rw') {
      stages = [
        { section: 'rw', mod: 1, title: 'Reading & Writing · Module 1', mins: 32, count: 27 },
        { section: 'rw', mod: 2, title: 'Reading & Writing · Module 2', mins: 32, count: 27, adaptive: true }
      ];
    } else if (mode === 'math') {
      stages = [
        { section: 'math', mod: 1, title: 'Math · Module 1', mins: 35, count: 22 },
        { section: 'math', mod: 2, title: 'Math · Module 2', mins: 35, count: 22, adaptive: true }
      ];
    } else if (mode === 'diagnostic') {
      stages = [
        { section: 'rw', mod: 1, title: 'Express Diagnostic · Reading & Writing', mins: 9, count: 8 },
        { section: 'math', mod: 1, title: 'Express Diagnostic · Math', mins: 11, count: 8 }
      ];
    } else if (mode === 'boss') {
      stages = [
        { section: 'rw', mod: 1, title: '1600 Boss Gauntlet · Elite RW', mins: 10, count: 8, forceDiff: 'elite' },
        { section: 'math', mod: 1, title: '1600 Boss Gauntlet · Elite Math', mins: 14, count: 8, forceDiff: 'elite' }
      ];
    } else if (mode === 'duel') {
      const duelType = opts.duelType || 'mixed';
      const count = opts.count || 10;
      const mins = duelType === 'math' ? Math.round(count * 1.5) : Math.round(count * 1.25);
      stages = [
        { section: duelType, mod: 1, title: opts.title || 'Friend Duel', mins, count, isDuel: true }
      ];
    }

    sess = {
      mode,
      seed,
      opts,
      stages,
      stageIdx: 0,
      exclude,
      qIdx: 0,
      questions: [],
      answers: {},       // qIdx -> choiceIdx (number) or spr string
      eliminated: {},    // qIdx -> Set of choiceIdx
      flagged: new Set(),
      highlights: {},    // qIdx -> saved passage HTML
      timeSpent: {},     // qIdx -> seconds
      qEnterAt: Date.now(),
      secLeft: 0,
      totalElapsed: 0,
      hideTimer: false,
      hlColor: 'hl-yellow',
      stageResults: [],  // collected after each completed stage
      routing: { rwHard: null, mathHard: null },
      finished: false,
      reviewIdx: 0
    };

    loadStage(0);
  }

  function checkpoint() {
    if (!sess || sess.finished) return;
    const elimObj = {};
    Object.keys(sess.eliminated || {}).forEach(k => {
      const s = sess.eliminated[k];
      if (s && s.size) elimObj[k] = Array.from(s);
    });
    const st = sess.stages[sess.stageIdx] || {};
    window.ApexStore.saveActiveExam({
      savedAt: Date.now(),
      mode: sess.mode,
      seed: sess.seed,
      opts: sess.opts,
      stages: sess.stages,
      stageIdx: sess.stageIdx,
      stageTitle: st.title || sess.mode,
      exclude: Array.from(sess.exclude || []),
      qIdx: sess.qIdx,
      questions: sess.questions,
      answers: sess.answers,
      eliminated: elimObj,
      flagged: Array.from(sess.flagged || []),
      highlights: sess.highlights,
      timeSpent: sess.timeSpent,
      secLeft: sess.secLeft,
      totalElapsed: sess.totalElapsed,
      hideTimer: sess.hideTimer,
      stageResults: sess.stageResults,
      routing: sess.routing
    });
  }

  function startStageTimer() {
    clearInterval(timerId);
    const st = sess.stages[sess.stageIdx];
    if (!st) return;
    if (st.section === 'break') {
      timerId = setInterval(() => {
        sess.secLeft--;
        const tEl = document.getElementById('break-timer');
        if (tEl) tEl.textContent = window.ApexUI.formatTime(sess.secLeft);
        if (sess.secLeft % 5 === 0) checkpoint();
        if (sess.secLeft <= 0) loadStage(sess.stageIdx + 1);
      }, 1000);
      return;
    }
    timerId = setInterval(() => {
      sess.secLeft--;
      sess.totalElapsed++;
      const tEl = document.getElementById('exam-timer-val');
      if (tEl && (!sess.hideTimer || sess.secLeft <= 300)) {
        tEl.textContent = window.ApexUI.formatTime(sess.secLeft);
        if (sess.secLeft <= 300) tEl.style.color = 'var(--error)';
      }
      if (sess.totalElapsed % 5 === 0) checkpoint();
      if (sess.secLeft <= 0) submitCurrentStage();
    }, 1000);
  }

  function resume() {
    const snap = window.ApexStore.get().activeExam;
    if (!snap || !Array.isArray(snap.stages)) {
      window.ApexUI.toast('No paused exam found.');
      return false;
    }
    const elimMap = {};
    Object.keys(snap.eliminated || {}).forEach(k => { elimMap[k] = new Set(snap.eliminated[k]); });
    sess = {
      mode: snap.mode,
      seed: snap.seed,
      opts: snap.opts || {},
      stages: snap.stages,
      stageIdx: snap.stageIdx || 0,
      exclude: new Set(snap.exclude || []),
      qIdx: snap.qIdx || 0,
      questions: snap.questions || [],
      answers: snap.answers || {},
      eliminated: elimMap,
      flagged: new Set(snap.flagged || []),
      highlights: snap.highlights || {},
      timeSpent: snap.timeSpent || {},
      qEnterAt: Date.now(),
      secLeft: typeof snap.secLeft === 'number' ? snap.secLeft : 600,
      totalElapsed: snap.totalElapsed || 0,
      hideTimer: !!snap.hideTimer,
      hlColor: 'hl-yellow',
      stageResults: snap.stageResults || [],
      routing: snap.routing || { rwHard: null, mathHard: null },
      finished: false,
      reviewIdx: 0
    };
    const st = sess.stages[sess.stageIdx];
    if (!st) { finishExam(); return true; }
    if (st.section === 'break') renderBreakScreen();
    else renderExamScreen();
    startStageTimer();
    window.ApexUI.toast('Resumed your saved exam right where you left off.');
    return true;
  }

  function loadStage(idx) {
    clearInterval(timerId);
    sess.stageIdx = idx;
    const st = sess.stages[idx];
    if (!st) { finishExam(); return; }

    if (st.section === 'break') {
      sess.secLeft = st.mins * 60;
      checkpoint();
      renderBreakScreen();
      startStageTimer();
      return;
    }

    // Build questions for stage
    const eng = window.SATQuestionEngine;
    if (st.isDuel) {
      if (st.section === 'rw') sess.questions = eng.sampleRW(st.count, { difficulty: 'all' }, sess.seed, new Set());
      else if (st.section === 'math') sess.questions = eng.sampleMath(st.count, { difficulty: 'all' }, sess.seed, new Set());
      else {
        const half = Math.floor(st.count / 2);
        const rwQ = eng.sampleRW(half, { difficulty: 'all' }, sess.seed + 7, new Set());
        const mQ = eng.sampleMath(st.count - half, { difficulty: 'all' }, sess.seed + 19, new Set());
        sess.questions = rwQ.concat(mQ);
      }
    } else if (st.adaptive) {
      const prev = sess.stageResults.find(r => r.section === st.section && r.mod === 1);
      const routeHard = prev ? (prev.correct / prev.total) >= 0.66 : true;
      if (st.section === 'rw') sess.routing.rwHard = routeHard;
      else sess.routing.mathHard = routeHard;
      st.title = `${st.section === 'rw' ? 'Reading & Writing' : 'Math'} · Module 2 (${routeHard ? 'Hard 1600-Track' : 'Baseline Track'})`;
      sess.questions = eng.buildAdaptiveModule(st.section, 2, routeHard, sess.seed + idx * 100, sess.exclude);
    } else if (st.count === 27 || st.count === 22) {
      sess.questions = eng.buildAdaptiveModule(st.section, 1, false, sess.seed + idx * 100, sess.exclude);
    } else {
      const filter = st.forceDiff ? { difficulty: st.forceDiff } : {};
      sess.questions = st.section === 'rw'
        ? eng.sampleRW(st.count, filter, sess.seed + idx * 100, sess.exclude)
        : eng.sampleMath(st.count, filter, sess.seed + idx * 100, sess.exclude);
      sess.questions.forEach(q => sess.exclude.add(q.id));
    }

    sess.qIdx = 0;
    sess.answers = {};
    sess.eliminated = {};
    sess.flagged = new Set();
    sess.highlights = {};
    sess.timeSpent = {};
    sess.qEnterAt = Date.now();
    sess.secLeft = st.mins * 60;

    checkpoint();
    renderExamScreen();
    startStageTimer();
  }

  function recordCurrentTime() {
    if (!sess) return;
    const delta = Math.max(1, Math.round((Date.now() - sess.qEnterAt) / 1000));
    sess.timeSpent[sess.qIdx] = (sess.timeSpent[sess.qIdx] || 0) + delta;
    sess.qEnterAt = Date.now();
  }

  function gradeQuestion(q, userAns) {
    if (userAns === undefined || userAns === null || userAns === '') return false;
    if (q.type === 'spr') return window.SATMathUtils.checkSprAnswer(userAns, q.accepted);
    return Number(userAns) === q.answer;
  }

  function submitCurrentStage() {
    clearInterval(timerId);
    recordCurrentTime();
    const st = sess.stages[sess.stageIdx];
    let correct = 0;
    const records = sess.questions.map((q, i) => {
      const ua = sess.answers[i];
      const ok = gradeQuestion(q, ua);
      if (ok) correct++;
      const sec = sess.timeSpent[i] || 20;
      const flg = sess.flagged.has(i);
      window.ApexStore.recordAttempt(q, ok, sec, flg);
      return { q, userAns: ua, ok, sec, flagged: flg, stageTitle: st.title };
    });

    sess.stageResults.push({
      section: st.section,
      mod: st.mod,
      title: st.title,
      correct,
      total: sess.questions.length,
      records
    });

    const nextSt = sess.stages[sess.stageIdx + 1];
    if (nextSt && nextSt.adaptive) {
      renderRoutingInterstitial(st, correct, sess.questions.length);
    } else if (nextSt) {
      loadStage(sess.stageIdx + 1);
    } else {
      finishExam();
    }
  }

  function renderRoutingInterstitial(prevStage, correct, total) {
    const pct = Math.round((correct / total) * 100);
    const hard = (correct / total) >= 0.66;
    const ov = document.getElementById('exam-overlay');
    ov.classList.remove('hidden');
    ov.innerHTML = `
      <div class="flex-1 flex items-center justify-center p-6">
        <div class="surface-card max-w-lg w-full p-7 text-center space-y-4">
          <div class="section-kicker">Bluebook Adaptive Routing</div>
          <h2 class="text-xl font-bold m-0">${prevStage.title} Complete</h2>
          <div class="text-sm text-[var(--muted-foreground)]">
            Module 1 Accuracy: <strong class="text-[var(--foreground)] tabular">${correct}/${total} (${pct}%)</strong>
          </div>
          <div class="surface-subtle p-4 text-left space-y-1">
            <div class="font-bold text-sm" style="color:${hard ? 'var(--success)' : 'var(--warning)'}">
              ${hard ? 'Routed to Module 2: Hard (1600-Track)' : 'Routed to Module 2: Baseline Track'}
            </div>
            <div class="text-xs text-[var(--muted-foreground)]">
              ${hard
                ? 'You cleared the Module 1 cutoff (≥66%). Full 800-point ceiling is unlocked — expect elite 750–800 level traps and multi-step reasoning.'
                : 'Just like the real Digital SAT, scoring below 66% on Module 1 routes you to the Baseline Module 2 (score ceiling ~620). Finish strong to maximize points!'}
            </div>
          </div>
          <button id="route-continue-btn" class="btn btn-primary btn-lg w-full">Begin Module 2</button>
        </div>
      </div>
    `;
    ov.querySelector('#route-continue-btn').onclick = () => loadStage(sess.stageIdx + 1);
  }

  function renderBreakScreen() {
    const ov = document.getElementById('exam-overlay');
    ov.classList.remove('hidden');
    ov.innerHTML = `
      <div class="flex-1 flex items-center justify-center p-6">
        <div class="surface-card max-w-md w-full p-7 text-center space-y-4">
          <div class="section-kicker">Official Digital SAT Break</div>
          <h2 class="text-xl font-bold m-0">Reading &amp; Writing Complete</h2>
          <div id="break-timer" class="text-4xl font-bold font-mono tabular">${window.ApexUI.formatTime(sess.secLeft)}</div>
          <p class="text-xs text-[var(--muted-foreground)] m-0">Step away, drink water, reset your focus for Math Modules 1 &amp; 2 — or skip straight ahead whenever ready.</p>
          <button id="skip-break-btn" class="btn btn-primary btn-lg w-full">Start Math Section Now</button>
        </div>
      </div>
    `;
    ov.querySelector('#skip-break-btn').onclick = () => loadStage(sess.stageIdx + 1);
  }

  function renderExamScreen() {
    const ov = document.getElementById('exam-overlay');
    ov.classList.remove('hidden');
    const st = sess.stages[sess.stageIdx];
    const q = sess.questions[sess.qIdx];
    const isRW = q.section === 'rw';
    const elimSet = sess.eliminated[sess.qIdx] || new Set();
    const userAns = sess.answers[sess.qIdx];
    const isFlagged = sess.flagged.has(sess.qIdx);
    const letters = ['A', 'B', 'C', 'D'];
    const savedHl = sess.highlights[sess.qIdx];

    ov.innerHTML = `
      <div class="exam-topbar">
        <div class="min-w-0">
          <div class="font-bold text-sm truncate">${window.ApexUI.esc(st.title)}</div>
          <div class="text-xs text-[var(--muted-foreground)]">${window.ApexUI.esc(q.subskill)} · ${q.difficulty === 'elite' ? '1600 Ceiling' : q.difficulty === 'target' ? 'Target 650–740' : 'Foundation'}</div>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1.5 px-2.5 py-1 surface-card text-sm font-mono font-bold tabular">
            <span id="exam-timer-val">${sess.hideTimer && sess.secLeft > 300 ? 'Hidden' : window.ApexUI.formatTime(sess.secLeft)}</span>
            <button id="toggle-timer-btn" class="text-xs font-sans font-semibold text-[var(--muted-foreground)] hover:text-[var(--foreground)] bg-transparent border-0 cursor-pointer ml-1">${sess.hideTimer ? 'Show' : 'Hide'}</button>
          </div>
          ${!isRW ? `
            <button id="exam-calc-btn" class="btn btn-sm btn-primary">Desmos</button>
            <button id="exam-ref-btn" class="btn btn-sm">Reference</button>
          ` : `
            <div class="hidden sm:flex items-center gap-1 surface-subtle px-2 py-1 text-xs">
              <span class="text-[var(--muted-foreground)] mr-1">Highlight:</span>
              <button class="btn btn-sm py-0.5 px-2" data-hl-apply="hl-yellow" title="Highlight selected text yellow">Y</button>
              <button class="btn btn-sm py-0.5 px-2" data-hl-apply="hl-blue" title="Highlight selected text blue">B</button>
              <button class="btn btn-sm py-0.5 px-2" data-hl-apply="hl-pink" title="Highlight selected text pink">P</button>
              <button id="hl-clear-btn" class="btn btn-sm py-0.5 px-2" title="Clear highlights">Clear</button>
            </div>
          `}
          <button id="exam-exit-btn" class="btn btn-sm">Exit</button>
        </div>
      </div>

      <div class="exam-body">
        ${isRW ? `
          <div class="exam-pane exam-pane-split" id="passage-pane">
            <div id="passage-content">${savedHl || window.ApexUI.renderPassageHTML(q)}</div>
          </div>
        ` : ''}

        <div class="exam-pane">
          <div class="${isRW ? '' : 'max-w-2xl mx-auto'} space-y-4">
            <div class="flex items-center justify-between pb-2.5 border-b border-[var(--border)]">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded bg-[var(--foreground)] text-[var(--background)] font-bold text-xs tabular">${sess.qIdx + 1}</span>
                <button id="flag-q-btn" class="btn btn-sm ${isFlagged ? 'btn-primary' : ''}">
                  ${isFlagged ? 'Flagged for Review' : 'Mark for Review'}
                </button>
              </div>
              <span class="text-xs text-[var(--muted-foreground)]">${q.type === 'spr' ? 'Student-Produced Response' : 'Multiple Choice'}</span>
            </div>

            ${!isRW ? window.ApexUI.renderPassageHTML(q) : ''}

            <div class="text-[15px] leading-relaxed font-medium whitespace-pre-line">${window.ApexUI.esc(q.prompt)}</div>

            ${q.type === 'spr' ? `
              <div class="surface-subtle p-4 space-y-2 max-w-sm">
