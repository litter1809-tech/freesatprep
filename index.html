                <label class="text-xs font-semibold text-[var(--muted-foreground)] block">Enter exact integer, decimal, or fraction (e.g., 7, -3.5, 32/3)</label>
                <input id="spr-answer-input" type="text" class="field-input font-mono text-base font-bold" value="${window.ApexUI.esc(userAns || '')}" placeholder="Type your answer..." autocomplete="off" />
                <div class="text-xs text-[var(--muted-foreground)]">Equivalent fractions and decimals are both graded full credit, just like Bluebook.</div>
              </div>
            ` : `
              <div class="space-y-2.5">
                ${q.choices.map((ch, idx) => {
                  const sel = userAns === idx;
                  const elim = elimSet.has(idx);
                  return `
                    <div class="choice-row">
                      <button class="choice-btn ${sel ? 'selected' : ''} ${elim ? 'eliminated' : ''}" data-choice-idx="${idx}">
                        <span class="choice-letter">${letters[idx]}</span>
                        <span class="flex-1">${window.ApexUI.esc(ch)}</span>
                      </button>
                      <button class="elim-btn ${elim ? 'active' : ''}" data-elim-idx="${idx}" title="Cross out / eliminate choice">✕</button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      </div>

      <div class="exam-bottombar">
        <div class="text-xs text-[var(--muted-foreground)] hidden sm:block">
          ${Object.keys(sess.answers).filter(k => sess.answers[k] !== '' && sess.answers[k] !== undefined).length} of ${sess.questions.length} answered · ${sess.flagged.size} flagged
        </div>
        <button id="open-qmap-btn" class="btn btn-sm font-bold tabular">
          Question ${sess.qIdx + 1} of ${sess.questions.length} ▾
        </button>
        <div class="flex items-center gap-2">
          <button id="prev-q-btn" class="btn" ${sess.qIdx === 0 ? 'disabled' : ''}>Back</button>
          ${sess.qIdx === sess.questions.length - 1
            ? `<button id="submit-mod-btn" class="btn btn-primary">Submit ${st.isDuel ? 'Duel' : 'Module'}</button>`
            : `<button id="next-q-btn" class="btn btn-primary">Next</button>`}
        </div>
      </div>
    `;

    // Bind events
    ov.querySelector('#toggle-timer-btn').onclick = () => { sess.hideTimer = !sess.hideTimer; renderExamScreen(); };
    if (ov.querySelector('#exam-calc-btn')) ov.querySelector('#exam-calc-btn').onclick = () => window.GraphingCalc.open('graph');
    if (ov.querySelector('#exam-ref-btn')) ov.querySelector('#exam-ref-btn').onclick = () => window.ApexUI.openReferenceSheet();
    ov.querySelector('#exam-exit-btn').textContent = 'Save & Pause';
    ov.querySelector('#exam-exit-btn').onclick = () => {
      recordCurrentTime();
      checkpoint();
      window.ApexUI.openModal('Pause or Exit Assessment?', `
        <p class="text-sm text-[var(--muted-foreground)] mt-0">Your exact answers, highlights, flags, and remaining timer (<strong class="text-[var(--foreground)] tabular">${window.ApexUI.formatTime(sess.secLeft)}</strong>) can be saved so you can resume later from the Command Center or Bluebook Mocks screen.</p>
        <div class="flex flex-wrap justify-end gap-2 mt-4">
          <button id="cancel-exit" class="btn">Keep Testing</button>
          <button id="discard-exit" class="btn">Discard Exam</button>
          <button id="save-pause-exit" class="btn btn-primary">Save &amp; Resume Later</button>
        </div>
      `, (root, close) => {
        root.querySelector('#cancel-exit').onclick = close;
        root.querySelector('#discard-exit').onclick = () => { window.ApexStore.clearActiveExam(); close(); closeOverlay(); window.ApexApp.render(); };
        root.querySelector('#save-pause-exit').onclick = () => {
          checkpoint();
          close();
          closeOverlay();
          window.ApexApp.render();
          window.ApexUI.toast('Exam progress saved! Click Resume anytime to continue.');
        };
      });
    };

    // Highlight tools for RW
    ov.querySelectorAll('[data-hl-apply]').forEach(btn => {
      btn.onclick = () => applyHighlight(btn.dataset.hlApply);
    });
    const clearHl = ov.querySelector('#hl-clear-btn');
    if (clearHl) clearHl.onclick = () => { delete sess.highlights[sess.qIdx]; checkpoint(); renderExamScreen(); };

    ov.querySelector('#flag-q-btn').onclick = () => {
      if (sess.flagged.has(sess.qIdx)) sess.flagged.delete(sess.qIdx);
      else sess.flagged.add(sess.qIdx);
      checkpoint();
      renderExamScreen();
    };

    if (q.type === 'spr') {
      const inp = ov.querySelector('#spr-answer-input');
      inp.oninput = () => { sess.answers[sess.qIdx] = inp.value.trim(); checkpoint(); };
      inp.focus();
    } else {
      ov.querySelectorAll('[data-choice-idx]').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.choiceIdx);
          sess.answers[sess.qIdx] = i;
          if (sess.eliminated[sess.qIdx]) sess.eliminated[sess.qIdx].delete(i);
          checkpoint();
          renderExamScreen();
        };
      });
      ov.querySelectorAll('[data-elim-idx]').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.elimIdx);
          if (!sess.eliminated[sess.qIdx]) sess.eliminated[sess.qIdx] = new Set();
          if (sess.eliminated[sess.qIdx].has(i)) sess.eliminated[sess.qIdx].delete(i);
          else {
            sess.eliminated[sess.qIdx].add(i);
            if (sess.answers[sess.qIdx] === i) delete sess.answers[sess.qIdx];
          }
          checkpoint();
          renderExamScreen();
        };
      });
    }

    ov.querySelector('#prev-q-btn').onclick = () => { if (sess.qIdx > 0) { recordCurrentTime(); sess.qIdx--; checkpoint(); renderExamScreen(); } };
    const nextBtn = ov.querySelector('#next-q-btn');
    if (nextBtn) nextBtn.onclick = () => { recordCurrentTime(); sess.qIdx++; checkpoint(); renderExamScreen(); };
    const subBtn = ov.querySelector('#submit-mod-btn');
    if (subBtn) subBtn.onclick = () => {
      const unanswered = sess.questions.length - Object.keys(sess.answers).filter(k => sess.answers[k] !== '' && sess.answers[k] !== undefined).length;
      if (unanswered > 0) {
        window.ApexUI.openModal('Submit Module?', `
          <p class="text-sm text-[var(--muted-foreground)] mt-0">You have <strong class="text-[var(--foreground)]">${unanswered} unanswered</strong> question(s). On the Digital SAT there is NO guessing penalty — never leave a question blank!</p>
          <div class="flex justify-end gap-2 mt-4">
            <button id="go-back-btn" class="btn">Review Unanswered</button>
            <button id="confirm-sub-btn" class="btn btn-primary">Submit Anyway</button>
          </div>
        `, (root, close) => {
          root.querySelector('#go-back-btn').onclick = () => { close(); openQuestionMap(); };
          root.querySelector('#confirm-sub-btn').onclick = () => { close(); submitCurrentStage(); };
        });
      } else {
        submitCurrentStage();
      }
    };

    ov.querySelector('#open-qmap-btn').onclick = openQuestionMap;
  }

  function applyHighlight(cls) {
    const sel = window.getSelection();
    const container = document.getElementById('passage-content');
    if (!sel || sel.isCollapsed || !container || !container.contains(sel.anchorNode)) {
      window.ApexUI.toast('Select text inside the passage first to highlight it.');
      return;
    }
    try {
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = cls;
      range.surroundContents(mark);
      sel.removeAllRanges();
      sess.highlights[sess.qIdx] = container.innerHTML;
      checkpoint();
    } catch {
      window.ApexUI.toast('Highlight within a single paragraph.');
    }
  }

  function openQuestionMap() {
    const items = sess.questions.map((q, i) => {
      const answered = sess.answers[i] !== undefined && sess.answers[i] !== '';
      const flagged = sess.flagged.has(i);
      const cur = i === sess.qIdx;
      return `<button class="btn btn-sm tabular relative ${cur ? 'btn-primary' : ''}" data-jump="${i}" style="${answered && !cur ? 'border-color:var(--primary)' : ''}">
        ${i + 1}${flagged ? ' ★' : ''}${answered ? ' ✓' : ''}
      </button>`;
    }).join('');
    window.ApexUI.openModal(`Question Navigator — ${sess.stages[sess.stageIdx].title}`, `
      <div class="text-xs text-[var(--muted-foreground)] mb-3">✓ Answered &nbsp;·&nbsp; ★ Marked for Review</div>
      <div class="grid grid-cols-6 sm:grid-cols-9 gap-2">${items}</div>
    `, (root, close) => {
      root.querySelectorAll('[data-jump]').forEach(b => {
        b.onclick = () => { recordCurrentTime(); sess.qIdx = Number(b.dataset.jump); checkpoint(); close(); renderExamScreen(); };
      });
    });
  }

  function finishExam() {
    clearInterval(timerId);
    sess.finished = true;
    window.ApexStore.clearActiveExam();
    const allRecs = sess.stageResults.flatMap(s => s.records);
    const totalCorrect = allRecs.filter(r => r.ok).length;
    const totalQ = allRecs.length;

    // Compute scaled scores
    const eng = window.SATQuestionEngine;
    let rwScore = null, mathScore = null;
    const rwMods = sess.stageResults.filter(s => s.section === 'rw');
    const mathMods = sess.stageResults.filter(s => s.section === 'math');

    if (rwMods.length === 2) {
      rwScore = eng.calculateScaledScore(rwMods[0].correct, rwMods[0].total, rwMods[1].correct, rwMods[1].total, !!sess.routing.rwHard);
    } else if (rwMods.length === 1) {
      rwScore = Math.min(800, Math.max(200, Math.round((320 + (rwMods[0].correct / rwMods[0].total) * 480) / 10) * 10));
    }

    if (mathMods.length === 2) {
      mathScore = eng.calculateScaledScore(mathMods[0].correct, mathMods[0].total, mathMods[1].correct, mathMods[1].total, !!sess.routing.mathHard);
    } else if (mathMods.length === 1) {
      mathScore = Math.min(800, Math.max(200, Math.round((320 + (mathMods[0].correct / mathMods[0].total) * 480) / 10) * 10));
    }

    const totalScore = (rwScore !== null && mathScore !== null) ? (rwScore + mathScore) : null;
    const store = window.ApexStore.get();

    if (sess.mode !== 'duel') {
      store.exams.push({
        id: 'ex_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        mode: sess.mode,
        rwScore,
        mathScore,
        totalScore,
        rwHard: sess.routing.rwHard,
        mathHard: sess.routing.mathHard,
        accuracy: Math.round((totalCorrect / Math.max(1, totalQ)) * 100),
        durationSec: sess.totalElapsed
      });
      if (sess.mode === 'diagnostic' && rwScore && mathScore) {
        store.profile.currentRW = rwScore;
        store.profile.currentMath = mathScore;
        store.profile.onboarded = true;
      }
      window.ApexStore.save();
    } else {
      // Save duel result and generate outgoing challenge code
      const code = window.ApexStore.makeChallengeCode({
        seed: sess.seed,
        mode: sess.opts.duelType || 'mixed',
        count: totalQ,
        author: store.profile.name || 'Scholar',
        score: totalCorrect,
        sec: sess.totalElapsed,
        title: sess.opts.title || '1600 Friend Duel'
      });
      sess.generatedDuelCode = code;
      store.duels.unshift({
        id: 'duel_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        code,
        opponent: sess.opts.opponent || null,
        myScore: totalCorrect,
        oppScore: typeof sess.opts.oppScore === 'number' ? sess.opts.oppScore : null,
        total: totalQ,
        mySec: sess.totalElapsed,
        oppSec: typeof sess.opts.oppSec === 'number' ? sess.opts.oppSec : null,
        title: sess.opts.title || '1600 Friend Duel'
      });
      window.ApexStore.save();
    }

    sess.report = { allRecs, totalCorrect, totalQ, rwScore, mathScore, totalScore };
    sess.reviewIdx = 0;
    renderScoreReport();
  }

  function renderScoreReport() {
    const ov = document.getElementById('exam-overlay');
    const rep = sess.report;
    const isDuel = sess.mode === 'duel';
    const r = rep.allRecs[sess.reviewIdx];
    const letters = ['A', 'B', 'C', 'D'];

    // Domain summary
    const domMap = {};
    rep.allRecs.forEach(item => {
      const k = item.q.subskill;
      if (!domMap[k]) domMap[k] = { ok: 0, tot: 0, sec: 0 };
      domMap[k].tot++; if (item.ok) domMap[k].ok++; domMap[k].sec += item.sec;
    });

    const slowQs = rep.allRecs.filter(x => x.sec > (x.q.section === 'rw' ? 85 : 105));

    ov.innerHTML = `
      <div class="exam-topbar">
        <div class="font-bold text-sm">${isDuel ? 'Friend Duel Head-to-Head Scorecard' : 'Bluebook Score Report & 1600 Post-Mortem'}</div>
        <div class="flex items-center gap-2">
          <button id="report-calc-btn" class="btn btn-sm">Graphing Calc</button>
          <button id="report-done-btn" class="btn btn-primary btn-sm">Return to Studio</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 md:p-7">
        <div class="max-w-5xl mx-auto space-y-5">

          ${isDuel ? renderDuelSummaryCard(rep) : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="surface-card p-5">
                <div class="section-kicker">Scaled Score</div>
                <div class="text-4xl font-bold tabular mt-1">${rep.totalScore || (rep.rwScore || rep.mathScore)}</div>
                <div class="text-xs text-[var(--muted-foreground)] mt-1">
                  ${rep.totalScore ? `out of 1600 · ${1600 - rep.totalScore} pts from perfect` : 'Section score out of 800'}
                </div>
              </div>
              <div class="surface-card p-5 space-y-1.5">
                <div class="section-kicker">Section Breakdown &amp; Routing</div>
                ${rep.rwScore !== null ? `<div class="flex items-center justify-between text-sm"><span>Reading &amp; Writing</span><span class="font-bold tabular">${rep.rwScore} ${sess.routing.rwHard !== null ? `<span class="tag ${sess.routing.rwHard ? 'tag-success' : 'tag-warning'} ml-1">${sess.routing.rwHard ? 'Hard M2' : 'Base M2'}</span>` : ''}</span></div>` : ''}
                ${rep.mathScore !== null ? `<div class="flex items-center justify-between text-sm"><span>Math</span><span class="font-bold tabular">${rep.mathScore} ${sess.routing.mathHard !== null ? `<span class="tag ${sess.routing.mathHard ? 'tag-success' : 'tag-warning'} ml-1">${sess.routing.mathHard ? 'Hard M2' : 'Base M2'}</span>` : ''}</span></div>` : ''}
                <div class="text-xs text-[var(--muted-foreground)] pt-1">Raw Accuracy: ${rep.totalCorrect}/${rep.totalQ} (${Math.round(rep.totalCorrect/rep.totalQ*100)}%)</div>
              </div>
              <div class="surface-card p-5 space-y-1.5">
                <div class="section-kicker">Pacing &amp; Mistake Vault</div>
                <div class="text-sm">Total Time: <strong class="tabular">${window.ApexUI.formatTime(sess.totalElapsed)}</strong></div>
                <div class="text-xs text-[var(--muted-foreground)]">Pacing flags (&gt;85s RW / &gt;105s Math): <strong class="text-[var(--foreground)]">${slowQs.length}</strong></div>
                <div class="text-xs text-[var(--muted-foreground)]">Auto-added <strong class="text-[var(--foreground)]">${rep.allRecs.filter(x => !x.ok || x.flagged).length}</strong> missed/flagged items to Mistake Vault for SM-2 review.</div>
              </div>
            </div>
          `}

          <!-- Sub-skill Breakdown -->
          <div class="surface-card p-4">
            <div class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-3">Sub-Skill Diagnostic</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 text-xs">
              ${Object.entries(domMap).map(([sk, st]) => {
                const pct = Math.round((st.ok / st.tot) * 100);
                return `<div class="surface-subtle p-2.5 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="font-semibold truncate">${window.ApexUI.esc(sk)}</div>
                    <div class="text-[var(--muted-foreground)] tabular">Avg ${Math.round(st.sec / st.tot)}s/Q</div>
                  </div>
                  <span class="tag tabular ${pct === 100 ? 'tag-success' : pct >= 60 ? 'tag-warning' : 'tag-error'}">${st.ok}/${st.tot} (${pct}%)</span>
                </div>`;
              }).join('')}
            </div>
          </div>

          <!-- Interactive Question-by-Question Review -->
          <div class="surface-card p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
              <div class="font-bold text-sm">Question-by-Question Review</div>
              <div class="flex flex-wrap gap-1.5">
                ${rep.allRecs.map((it, idx) => `
                  <button class="btn btn-sm tabular ${idx === sess.reviewIdx ? 'btn-primary' : ''}" data-rev-idx="${idx}" style="${idx !== sess.reviewIdx ? `border-color:${it.ok ? 'var(--success)' : 'var(--error)'}` : ''}">
                    ${idx + 1}${it.ok ? '✓' : '✕'}
                  </button>
                `).join('')}
              </div>
            </div>

            ${r ? `
              <div class="space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-2">
                    <span class="tag ${r.ok ? 'tag-success' : 'tag-error'}">${r.ok ? 'Correct' : 'Missed'}</span>
                    <span class="tag">${window.ApexUI.esc(r.q.subskill)}</span>
                    <span class="text-[var(--muted-foreground)] tabular">Time: ${r.sec}s</span>
                  </div>
                  ${r.q.plotExprs && r.q.plotExprs.length ? `<button id="rev-plot-btn" class="btn btn-sm btn-primary">Open in Desmos</button>` : ''}
                </div>

                <div class="surface-subtle p-4 space-y-3">
                  ${window.ApexUI.renderPassageHTML(r.q)}
                  <div class="font-medium text-sm whitespace-pre-line">${window.ApexUI.esc(r.q.prompt)}</div>
                </div>

                ${r.q.type === 'spr' ? `
                  <div class="text-sm flex gap-4">
                    <span>Your Answer: <strong class="font-mono" style="color:${r.ok ? 'var(--success)' : 'var(--error)'}">${window.ApexUI.esc(r.userAns || '(blank)')}</strong></span>
                    <span>Correct Answer: <strong class="font-mono" style="color:var(--success)">${window.ApexUI.esc(r.q.displayAnswer)}</strong></span>
                  </div>
                ` : window.ApexUI.renderReviewedChoices(r.q, r.userAns, 'examrev_' + sess.reviewIdx)}

                <div class="surface-subtle p-4 space-y-2 text-sm">
                  <div class="font-bold text-xs uppercase tracking-wider text-[var(--muted-foreground)]">1600 Solution Walkthrough</div>
                  <div class="whitespace-pre-line">${window.ApexUI.esc(r.q.explanation)}</div>
                  ${r.q.desmos ? `<div class="pt-2 border-t border-[var(--border)] text-xs"><strong>Desmos / Speed Shortcut:</strong> ${window.ApexUI.esc(r.q.desmos)}</div>` : ''}
                  ${r.q.trapNote ? `<div class="pt-2 border-t border-[var(--border)] text-xs"><strong>1600 Trap Alert:</strong> ${window.ApexUI.esc(r.q.trapNote)}</div>` : ''}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;

    ov.querySelector('#report-calc-btn').textContent = 'Desmos Calc';
    ov.querySelector('#report-calc-btn').onclick = () => window.GraphingCalc.open('sat_graph');
    ov.querySelector('#report-done-btn').onclick = () => { closeOverlay(); window.ApexApp.render(); };
    window.ApexUI.bindReviewedChoices(ov);
    ov.querySelectorAll('[data-rev-idx]').forEach(b => {
      b.onclick = () => { sess.reviewIdx = Number(b.dataset.revIdx); renderScoreReport(); };
    });
    const plotBtn = ov.querySelector('#rev-plot-btn');
    if (plotBtn && r && r.q.plotExprs) {
      plotBtn.onclick = () => window.GraphingCalc.loadExpressions(r.q.plotExprs);
    }
    const copyDuelBtn = ov.querySelector('#copy-duel-code-btn');
    if (copyDuelBtn) {
      copyDuelBtn.onclick = () => copyToClipboard(sess.generatedDuelCode, 'Challenge Code copied! Send it to a friend to duel on these exact questions.');
    }
    const copySummaryBtn = ov.querySelector('#copy-duel-text-btn');
    if (copySummaryBtn) {
      const opp = sess.opts.opponent;
      const msg = opp
        ? `APEX 1600 SAT Duel — ${sess.opts.title}\n${window.ApexStore.get().profile.name}: ${rep.totalCorrect}/${rep.totalQ} (${window.ApexUI.formatTime(sess.totalElapsed)}) vs ${opp}: ${sess.opts.oppScore}/${rep.totalQ} (${window.ApexUI.formatTime(sess.opts.oppSec)})\nChallenge Code: ${sess.generatedDuelCode}`
        : `I just scored ${rep.totalCorrect}/${rep.totalQ} in ${window.ApexUI.formatTime(sess.totalElapsed)} on an APEX 1600 SAT Duel (${sess.opts.title})! Paste this code in Friends & Duels to beat me on the exact same questions:\n${sess.generatedDuelCode}`;
      copySummaryBtn.onclick = () => copyToClipboard(msg, 'Shareable group-chat invite copied!');
    }
  }

  function renderDuelSummaryCard(rep) {
    const hasOpp = typeof sess.opts.oppScore === 'number';
    let verdict = 'Challenge Created! Send this code to a friend to race on these exact questions.';
    if (hasOpp) {
      if (rep.totalCorrect > sess.opts.oppScore || (rep.totalCorrect === sess.opts.oppScore && sess.totalElapsed < sess.opts.oppSec)) {
        verdict = `Victory! You beat ${sess.opts.opponent}!`;
      } else if (rep.totalCorrect === sess.opts.oppScore && sess.totalElapsed === sess.opts.oppSec) {
        verdict = `Exact Tie with ${sess.opts.opponent}!`;
      } else {
        verdict = `${sess.opts.opponent} takes this round — study the misses below and rematch!`;
      }
    }
    return `
      <div class="surface-card p-5 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="section-kicker">Seeded Friend Duel</div>
            <h2 class="text-xl font-bold m-0 mt-0.5">${window.ApexUI.esc(verdict)}</h2>
          </div>
          <div class="flex gap-2">
            <button id="copy-duel-text-btn" class="btn btn-primary btn-sm">Copy Group-Chat Result</button>
            <button id="copy-duel-code-btn" class="btn btn-sm">Copy Code Only</button>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="surface-subtle p-4">
            <div class="text-xs text-[var(--muted-foreground)]">${window.ApexUI.esc(window.ApexStore.get().profile.name)} (You)</div>
            <div class="text-2xl font-bold tabular mt-1">${rep.totalCorrect} / ${rep.totalQ} <span class="text-sm font-normal text-[var(--muted-foreground)]">in ${window.ApexUI.formatTime(sess.totalElapsed)}</span></div>
          </div>
          ${hasOpp ? `
            <div class="surface-subtle p-4">
              <div class="text-xs text-[var(--muted-foreground)]">${window.ApexUI.esc(sess.opts.opponent)} (Challenger)</div>
              <div class="text-2xl font-bold tabular mt-1">${sess.opts.oppScore} / ${rep.totalQ} <span class="text-sm font-normal text-[var(--muted-foreground)]">in ${window.ApexUI.formatTime(sess.opts.oppSec)}</span></div>
            </div>
          ` : `
            <div class="surface-subtle p-4">
              <div class="text-xs text-[var(--muted-foreground)]">Challenge Code (Exact Seed #${sess.seed})</div>
              <div class="font-mono text-xs break-all mt-1 select-all">${window.ApexUI.esc(sess.generatedDuelCode)}</div>
            </div>
          `}
        </div>
      </div>
    `;
  }

  function copyToClipboard(text, toastMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => window.ApexUI.toast(toastMsg)).catch(() => fallbackCopy(text, toastMsg));
    } else fallbackCopy(text, toastMsg);
  }
  function fallbackCopy(text, toastMsg) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); window.ApexUI.toast(toastMsg); } catch { window.ApexUI.toast('Select and copy the code manually.'); }
    document.body.removeChild(ta);
  }

  function closeOverlay() {
    clearInterval(timerId);
    sess = null;
    const ov = document.getElementById('exam-overlay');
    if (ov) { ov.classList.add('hidden'); ov.innerHTML = ''; }
  }

  window.addEventListener('beforeunload', () => {
    if (sess && !sess.finished) { recordCurrentTime(); checkpoint(); }
  });

  return { start, resume, checkpoint, copyToClipboard };
})();
</script>

<script>
/* ============================================================================
   MODULE 6: MAIN APPLICATION CONTROLLER & ALL 7 WORKSPACES
   ============================================================================ */
window.ApexApp = (function(){
  const ui = {
    view: 'overview',
    playbookTab: 'grammar', // 'grammar' | 'math' | 'reading' | 'vocab'
    // Drill Lab state
    drillCfg: { section: 'math', domain: 'all', subskill: 'all', difficulty: 'all', count: 10, mode: 'coach' },
    drillSess: null,
    // Mistake Vault state
    mistakeQuiz: null,
    mistakeFilter: 'due', // 'due' | 'all' | 'mastered'
    // Vocab SRS state
    vocabMode: 'flashcard', // 'flashcard' | 'quiz'
    vocabIdx: 0,
    vocabFlipped: false,
    vocabQuiz: null
  };

  function init() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.onclick = () => {
        ui.view = btn.dataset.view;
        closeMobileMenu();
        render();
      };
    });
    const mBtn = document.getElementById('mobile-menu-btn');
    if (mBtn) mBtn.onclick = () => document.getElementById('sidebar').classList.toggle('open');
    const cBtn = document.getElementById('open-calc-global');
    if (cBtn) cBtn.onclick = () => window.GraphingCalc.toggle();
    const mcBtn = document.getElementById('mobile-calc-btn');
    if (mcBtn) mcBtn.onclick = () => window.GraphingCalc.toggle();
    const sBtn = document.getElementById('open-save-global');
    if (sBtn) sBtn.onclick = () => { closeMobileMenu(); openSaveModal(); };
    const msBtn = document.getElementById('mobile-save-btn');
    if (msBtn) msBtn.onclick = () => openSaveModal();

    // Support URL hash challenge auto-import (e.g. #challenge=APEXDUEL:...)
    if (window.location.hash && window.location.hash.startsWith('#challenge=')) {
      const code = decodeURIComponent(window.location.hash.slice(11));
      ui.view = 'friends';
      ui.pendingChallengeCode = code;
    }

    render();
  }

  function closeMobileMenu() {
    const sb = document.getElementById('sidebar');
    if (sb) sb.classList.remove('open');
  }

  function updateSidebar() {
    const st = window.ApexStore.get();
    const sc = window.ApexStore.getProjectedScores();
    const dueCount = window.ApexStore.getDueMistakes().length;

    const elTotal = document.getElementById('sidebar-total-score');
    const elSplit = document.getElementById('sidebar-split-score');
    const elBar = document.getElementById('sidebar-score-bar');
    const elTarget = document.getElementById('sidebar-target-lbl');
    const elStreak = document.getElementById('sidebar-streak');
    const elSolved = document.getElementById('sidebar-solved');
    const elDue = document.getElementById('nav-due-badge');
    const elMob = document.getElementById('mobile-score-pill');

    if (elTotal) elTotal.textContent = sc.total;
    if (elSplit) elSplit.textContent = `RW ${sc.rw} · Math ${sc.math}`;
    if (elTarget) elTarget.textContent = `Goal: ${st.profile.targetScore || 1600}`;
    if (elBar) elBar.style.width = `${Math.max(5, Math.round(((sc.total - 400) / 1200) * 100))}%`;
    if (elStreak) elStreak.textContent = `${st.streak.count} day${st.streak.count === 1 ? '' : 's'}`;
    if (elSolved) elSolved.textContent = String(st.stats.totalSolved);
    if (elMob) elMob.textContent = `Est. ${sc.total}`;
    if (elDue) {
      elDue.textContent = String(dueCount);
      elDue.classList.toggle('hidden', dueCount === 0);
    }
    window.ApexStore.notifySaveIndicator();

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === ui.view);
    });
  }

  function openSaveModal() {
    const st = window.ApexStore.get();
    const sc = window.ApexStore.getProjectedScores();
    const canLocal = window.ApexStore.isStorageAvailable();
    const lastAt = window.ApexStore.getLastSavedAt();
    const slots = window.ApexStore.listSlots();
    const fmtAt = (ts) => ts ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Not saved yet';

    const bodyHtml = `
      <div class="space-y-5">
        <!-- Auto-Save Status -->
        <div class="surface-subtle p-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="font-bold text-sm" style="color:${canLocal ? 'var(--success)' : 'var(--warning)'}">
              ${canLocal ? 'Browser Auto-Save Active' : 'Restricted Storage Mode — Use Save Code or File'}
            </div>
            <div class="text-xs text-[var(--muted-foreground)] mt-0.5">
              ${canLocal
                ? `Progress auto-saves on every answer, study plan check, and paused exam. Last saved: ${fmtAt(lastAt)}.`
                : 'Your browser preview restricts automatic local storage. Copy a Save Code or download a Save File below so you never lose progress!'}
            </div>
          </div>
          <button id="sm-save-now" class="btn btn-primary btn-sm">Save Now</button>
        </div>

        <!-- Portable Save Code (Works Across Any Device / Browser / Preview) -->
        <div class="space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="font-bold text-sm">Portable Save Code (Any Device or Browser)</div>
              <div class="text-xs text-[var(--muted-foreground)]">Copy your <code class="font-mono">APEXSAVE:...</code> code to save in Notes/Discord or transfer your exact scores, Mistake Vault, Vocab SRS &amp; paused tests to another device.</div>
            </div>
            <button id="sm-copy-code" class="btn btn-primary btn-sm">Copy Save Code</button>
          </div>
          <div class="flex gap-2">
            <input id="sm-restore-inp" type="text" class="field-input font-mono text-xs" placeholder="Paste an APEXSAVE:... code here to restore your progress" />
            <button id="sm-restore-btn" class="btn shrink-0">Load Code</button>
          </div>
        </div>

        <!-- File Backup (.json) -->
        <div class="pt-3 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
          <div>
            <div class="font-bold text-sm">Save &amp; Load File (.json)</div>
            <div class="text-xs text-[var(--muted-foreground)]">Download a permanent backup file for ${window.ApexUI.esc(st.profile.name)} (${sc.total} projected · ${st.stats.totalSolved} Qs solved).</div>
          </div>
          <div class="flex gap-2">
            <button id="sm-dl-json" class="btn btn-sm">Download Save File</button>
            <label class="btn btn-sm cursor-pointer">Load Save File<input id="sm-ul-json" type="file" accept=".json" class="hidden" /></label>
          </div>
        </div>

        <!-- 3 Local Named Save Slots -->
        <div class="pt-3 border-t border-[var(--border)] space-y-2.5">
          <div>
            <div class="font-bold text-sm">Local Profile / Checkpoint Slots (3 Slots)</div>
            <div class="text-xs text-[var(--muted-foreground)]">Save a checkpoint before a big mock or let multiple friends share one device without overwriting each other.</div>
          </div>
          <div class="space-y-2">
            ${[0, 1, 2].map(idx => {
              const s = slots[idx];
              return `<div class="surface-subtle p-3 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="min-w-0">
                  <div class="font-bold">Slot ${idx + 1}: ${s ? window.ApexUI.esc(s.label) : '<span class="text-[var(--muted-foreground)] font-normal">Empty</span>'}</div>
                  ${s ? `<div class="text-[var(--muted-foreground)] tabular">${s.projected} est · ${s.solved} Qs · Saved ${fmtAt(s.savedAt)}</div>` : ''}
                </div>
                <div class="flex gap-1.5">
                  <button class="btn btn-sm" data-slot-save="${idx}">Save Here</button>
                  ${s ? `<button class="btn btn-sm btn-primary" data-slot-load="${idx}">Load</button><button class="btn btn-sm" data-slot-del="${idx}">Clear</button>` : ''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    window.ApexUI.openModal('Save & Load Progress', bodyHtml, (root, close) => {
      root.querySelector('#sm-save-now').onclick = () => {
        window.ApexStore.save();
        updateSidebar();
        window.ApexUI.toast('Progress saved!');
        openSaveModal();
      };
      root.querySelector('#sm-copy-code').onclick = () => {
        const code = window.ApexStore.makeSaveCode();

    window.ApexStore.saveActiveDrill({
      savedAt: Date.now(),
      questions: ds.questions,
      idx: ds.idx,
      selected: ds.selected,
      sprVal: ds.sprVal,
      submitted: ds.submitted,
      isCorrect: ds.isCorrect,
      score: ds.score,
      eliminated: Array.from(ds.eliminated || []),
      flagged: ds.flagged,
      rootCause: ds.rootCause,
      done: ds.done,
      log: ds.log
    });
  }

  function resumeSavedDrill() {
    const snap = window.ApexStore.get().activeDrill;
    if (!snap || !Array.isArray(snap.questions) || snap.done) {
      window.ApexUI.toast('No paused drill found.');
      return;
    }
    ui.drillSess = {
      questions: snap.questions,
      idx: snap.idx || 0,
      selected: snap.selected !== undefined ? snap.selected : null,
      sprVal: snap.sprVal || '',
      submitted: !!snap.submitted,
      isCorrect: !!snap.isCorrect,
      score: snap.score || 0,
      qStart: Date.now(),
      eliminated: new Set(snap.eliminated || []),
      flagged: !!snap.flagged,
      rootCause: snap.rootCause || 'concept',
      done: false,
      log: snap.log || []
    };
    ui.view = 'drills';
    render();
    window.ApexUI.toast('Resumed your saved drill.');

  function renderTrajectorySVG(exams, currentEst, target) {
    const pts = exams.filter(e => e.totalScore).map(e => ({ label: e.date.slice(5), val: e.totalScore }));
    if (pts.length === 0) {
      pts.push({ label: 'Now', val: currentEst }, { label: 'Goal', val: target });
    } else if (pts.length === 1) {
      pts.push({ label: 'Now', val: currentEst });
    }
    const w = 340, h = 148, padL = 38, padR = 14, padT = 16, padB = 24;
    const minY = 400, maxY = 1600;
    const xAt = (i) => padL + (i / Math.max(1, pts.length - 1)) * (w - padL - padR);
    const yAt = (v) => padT + ((maxY - v) / (maxY - minY)) * (h - padT - padB);
    const poly = pts.map((p, i) => `${xAt(i).toFixed(1)},${yAt(p.val).toFixed(1)}`).join(' ');
    const goalY = yAt(target).toFixed(1);

    return `<svg viewBox="0 0 ${w} ${h}" class="w-full" role="img" aria-label="Score trajectory chart">
      ${[1600, 1300, 1000, 700].map(v => `
        <line x1="${padL}" y1="${yAt(v)}" x2="${w - padR}" y2="${yAt(v)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3" />
        <text x="${padL - 6}" y="${yAt(v) + 4}" fill="var(--muted-foreground)" font-size="10" text-anchor="end">${v}</text>
      `).join('')}
      <line x1="${padL}" y1="${goalY}" x2="${w - padR}" y2="${goalY}" stroke="var(--success)" stroke-width="1.2" stroke-dasharray="4,3" />
      <polyline points="${poly}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
      ${pts.map((p, i) => `
        <circle cx="${xAt(i)}" cy="${yAt(p.val)}" r="3.8" fill="var(--primary)" />
        <text x="${xAt(i)}" y="${h - 6}" fill="var(--muted-foreground)" font-size="10" text-anchor="middle">${p.label}</text>
      `).join('')}
    </svg>`;
  }

  /* --------------------------------------------------------------------------

     -------------------------------------------------------------------------- */
  function launchTargetedDrill(section, domain, subskill, count) {
    ui.drillCfg.section = section;
    ui.drillCfg.domain = domain || 'all';
    ui.drillCfg.subskill = subskill || 'all';
    ui.drillCfg.count = count || 10;
    ui.view = 'drills';
    startDrillSession();
    render();
  }

  function startDrillSession() {
    const c = ui.drillCfg;
    const seed = Math.floor(Date.now() % 999999) + Math.floor(Math.random() * 5000);
    const eng = window.SATQuestionEngine;
    const filter = { domain: c.domain, subskill: c.subskill, difficulty: c.difficulty };
    let qs = [];
    if (c.section === 'rw') qs = eng.sampleRW(c.count, filter, seed);
    else if (c.section === 'math') qs = eng.sampleMath(c.count, filter, seed);
    else {
      const half = Math.ceil(c.count / 2);
      qs = eng.sampleRW(half, { difficulty: c.difficulty }, seed + 1).concat(eng.sampleMath(c.count - half, { difficulty: c.difficulty }, seed + 2));
    }
    ui.drillSess = {
      questions: qs,
      idx: 0,
      selected: null,
      sprVal: '',
      submitted: false,
      isCorrect: false,
      score: 0,
      qStart: Date.now(),
      eliminated: new Set(),
      flagged: false,
      rootCause: 'concept',
      done: false,
      log: []
    };
    checkpointDrill();
  }

    if (stage.querySelector('#dr-subskill')) {

    stage.querySelector('#dr-count').onchange = (e) => { c.count = Number(e.target.value); };
    stage.querySelector('#dr-mode').onchange = (e) => { c.mode = e.target.value; };
    stage.querySelector('#dr-start-btn').onclick = () => { startDrillSession(); renderDrills(stage); };
    stage.querySelector('#dr-preset-grammar').onclick = () => launchTargetedDrill('rw', 'conventions', 'all', 10);
    stage.querySelector('#dr-preset-quad').onclick = () => launchTargetedDrill('math', 'advanced', 'Quadratics & Discriminant', 10);

  function renderActiveDrill(stage) {

          </div>
        </div>
      `;

      stage.querySelector('#dr-config-btn').onclick = () => { ui.drillSess = null; renderDrills(stage); };

      <div class="max-w-3xl mx-auto space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
          <div class="flex items-center gap-2">

            <span class="tag">${window.ApexUI.esc(q.subskill)}</span>

            ${ds.submitted && q.plotExprs && q.plotExprs.length ? `<button id="dr-plot-btn" class="btn btn-sm">Open in Desmos</button>` : ''}

          ${ds.submitted ? `

              <div class="flex items-center justify-between flex-wrap gap-2">
                <span class="font-bold text-sm" style="color:${ds.isCorrect ? 'var(--success)' : 'var(--error)'}">
                  ${ds.isCorrect ? 'Correct! (+1)' : `Incorrect — Correct Answer: ${q.type === 'spr' ? q.displayAnswer : letters[q.answer]}`}
                </span>
                ${!ds.isCorrect ? `
                  <div class="flex items-center gap-1.5 text-xs">
                    <span class="text-[var(--muted-foreground)]">Tag Root Cause:</span>
                    <select id="dr-rc-sel" class="field-select py-1 px-2 text-xs w-auto">
                      ${window.ROOT_CAUSES.map(rc => `<option value="${rc.id}" ${ds.rootCause === rc.id ? 'selected' : ''}>${rc.label}</option>`).join('')}

      inp.oninput = () => {
        ds.sprVal = inp.value;
        const cb = stage.querySelector('#dr-check-btn');
        if (cb) cb.disabled = !inp.value.trim();
        checkpointDrill();
      };
      inp.onkeydown = (e) => { if (e.key === 'Enter' && inp.value.trim()) checkDrillAnswer(stage); };
      inp.focus();
    } else if (!ds.submitted) {
      stage.querySelectorAll('[data-dr-choice]').forEach(b => {
        b.onclick = () => { ds.selected = Number(b.dataset.drChoice); ds.eliminated.delete(ds.selected); checkpointDrill(); renderActiveDrill(stage); };
      });
      stage.querySelectorAll('[data-dr-elim]').forEach(b => {
        b.onclick = () => {
          const i = Number(b.dataset.drElim);
          if (ds.eliminated.has(i)) ds.eliminated.delete(i);
          else { ds.eliminated.add(i); if (ds.selected === i) ds.selected = null; }
          checkpointDrill();
          renderActiveDrill(stage);
        };
      });
    }

    const chk = stage.querySelector('#dr-check-btn');
    if (chk) chk.onclick = () => checkDrillAnswer(stage);

    const rcSel = stage.querySelector('#dr-rc-sel');
    if (rcSel) rcSel.onchange = () => {
      ds.rootCause = rcSel.value;
      const m = window.ApexStore.get().mistakes.find(x => x.key === q.id);
      if (m) { m.rootCause = ds.rootCause; window.ApexStore.save(); }
    };

    const plotBtn = stage.querySelector('#dr-plot-btn');
    if (plotBtn && q.plotExprs) plotBtn.onclick = () => window.GraphingCalc.loadExpressions(q.plotExprs);

    const nxt = stage.querySelector('#dr-next-btn');
    if (nxt) nxt.onclick = () => {
      if (ds.idx >= ds.questions.length - 1) {
        ds.done = true;
        window.ApexStore.clearActiveDrill();
      } else {
        ds.idx++; ds.selected = null; ds.sprVal = ''; ds.submitted = false; ds.eliminated = new Set(); ds.flagged = false; ds.qStart = Date.now();
        checkpointDrill();
      }
      renderActiveDrill(stage);
      updateSidebar();
    };
  }

  function checkDrillAnswer(stage) {
    const ds = ui.drillSess;
    const q = ds.questions[ds.idx];
    const sec = Math.max(2, Math.round((Date.now() - ds.qStart) / 1000));
    const ok = q.type === 'spr'
      ? window.SATMathUtils.checkSprAnswer(ds.sprVal, q.accepted)
      : ds.selected === q.answer;
    ds.submitted = true;
    ds.isCorrect = ok;
    if (ok) ds.score++;
    ds.log.push({ id: q.id, ok, sec, flagged: ds.flagged });
    window.ApexStore.recordAttempt(q, ok, sec, ds.flagged);
    checkpointDrill();
    updateSidebar();
    renderActiveDrill(stage);
  }

  function renderMistakeQuiz(stage) {
    const mq = ui.mistakeQuiz;
    const m = mq.items[mq.idx];
    if (!m) { ui.mistakeQuiz = null; renderMistakes(stage); return; }
    const q = m.question;
    const letters = ['A', 'B', 'C', 'D'];

    stage.innerHTML = `
      <div class="max-w-3xl mx-auto space-y-4">

          </div>
          ${q.section === 'math' ? '<button id="mq-calc" class="btn btn-sm">Desmos Calc</button>' : ''}
        </div>
        <div class="surface-card p-6 space-y-4">
          ${window.ApexUI.renderPassageHTML(q)}
          <div class="text-[15px] font-medium whitespace-pre-line">${window.ApexUI.esc(q.prompt)}</div>
          ${q.type === 'spr'
            ? `<input id="mq-spr" type="text" class="field-input font-mono max-w-xs" value="${window.ApexUI.esc(mq.spr)}" ${mq.checked ? 'disabled' : ''} placeholder="Enter answer..." />`
            : mq.checked
              ? window.ApexUI.renderReviewedChoices(q, mq.sel, 'mv_' + mq.idx)
              : `<div class="space-y-2">${q.choices.map((ch, i) => `
                  <button class="choice-btn w-full ${i === mq.sel ? 'selected' : ''}" data-mq-ch="${i}">
                    <span class="choice-letter">${letters[i]}</span><span class="flex-1">${window.ApexUI.esc(ch)}</span>
                  </button>`).join('')}</div>`}

          ${!mq.checked
            ? `<button id="mq-check" class="btn btn-primary" ${(q.type === 'spr' ? !mq.spr.trim() : mq.sel === null) ? 'disabled' : ''}>Verify Re-Solve</button>`
            : `<div class="surface-subtle p-4 space-y-2">
                <div class="font-bold text-sm" style="color:${mq.ok ? 'var(--success)' : 'var(--error)'}">
                  ${mq.ok ? `Clean Re-Solve! Next SM-2 Review in ${m.intervalDays} day(s).` : 'Missed again — interval reset to Review Now.'}
                </div>
                <div class="text-sm whitespace-pre-line">${window.ApexUI.esc(q.explanation)}</div>
                ${m.note ? `<div class="text-xs pt-2 border-t border-[var(--border)]"><strong>Your Note:</strong> ${window.ApexUI.esc(m.note)}</div>` : ''}
                <button id="mq-next" class="btn btn-primary mt-2">${mq.idx === mq.items.length - 1 ? 'Finish Session' : 'Next Mistake →'}</button>
              </div>`}
        </div>
      </div>
    `;

    if (mq.checked) window.ApexUI.bindReviewedChoices(stage);
    stage.querySelector('#mq-exit').onclick = () => { ui.mistakeQuiz = null; renderMistakes(stage); updateSidebar(); };
    if (stage.querySelector('#mq-calc')) stage.querySelector('#mq-calc').onclick = () => window.GraphingCalc.open('sat_graph');
    if (q.type === 'spr' && !mq.checked) {
      const inp = stage.querySelector('#mq-spr');
      inp.oninput = () => { mq.spr = inp.value; stage.querySelector('#mq-check').disabled = !inp.value.trim(); };
    } else if (!mq.checked) {
      stage.querySelectorAll('[data-mq-ch]').forEach(b => { b.onclick = () => { mq.sel = Number(b.dataset.mqCh); renderMistakeQuiz(stage); }; });
    }
    const chk = stage.querySelector('#mq-check');
    if (chk) chk.onclick = () => {
      mq.ok = q.type === 'spr' ? window.SATMathUtils.checkSprAnswer(mq.spr, q.accepted) : mq.sel === q.answer;
      mq.checked = true;
      window.ApexStore.reviewMistake(m.key, mq.ok);
      updateSidebar();
      renderMistakeQuiz(stage);
    };
    const nxt = stage.querySelector('#mq-next');
    if (nxt) nxt.onclick = () => {
      if (mq.idx >= mq.items.length - 1) { ui.mistakeQuiz = null; renderMistakes(stage); }
      else { mq.idx++; mq.sel = null; mq.spr = ''; mq.checked = false; renderMistakeQuiz(stage); }
    };
  }

  function getLearnPracticeSet(guide, forceFresh) {
    if (!ui.learnPractice) ui.learnPractice = {};
    const cur = ui.learnPractice[guide.id];
    if (!forceFresh && cur && Array.isArray(cur.questions) && cur.questions.length) return cur;
    const seed = Math.floor(Date.now() % 999999) + Math.floor(Math.random() * 7000) + window.SATMathUtils.hashStr(guide.id);
    const eng = window.SATQuestionEngine;
    const filter = guide.id === 'desmos'
      ? { domain: 'all', difficulty: 'all' }
      : { domain: guide.domain, difficulty: 'all' };
    const qs = guide.section === 'rw'
      ? eng.sampleRW(3, filter, seed)
      : eng.sampleMath(3, filter, seed);
    ui.learnPractice[guide.id] = {
      questions: qs,
      state: qs.map(() => ({ sel: null, spr: '', checked: false, ok: false }))
    };
    return ui.learnPractice[guide.id];
  }

    const rng = window.SATMathUtils.mulberry32(Date.now() % 100000);
    const pool = window.VOCAB_BANK.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const qs = pool.slice(0, 10).map((item, idx) => {
      const distractors = pool.filter(x => x.id !== item.id && x.pos === item.pos).slice(0, 3).map(x => x.word);
      const mc = window.SATMathUtils.makeUniqueMC(item.word, distractors, 900 + idx * 17);
      return { item, choices: mc.choices, answer: mc.answer };
    });
    ui.vocabMode = 'quiz';
    ui.vocabQuiz = { qs, idx: 0, sel: null, score: 0, done: false };
  }

  function renderVocabQuiz(box) {
    const vq = ui.vocabQuiz;
    if (vq.done) {
      box.innerHTML = `
        <div class="surface-card p-6 max-w-xl space-y-4">
          <div class="section-kicker">Precision Vocab Context Quiz</div>
          <h2 class="text-2xl font-bold m-0">${vq.score} / ${vq.qs.length} Correct</h2>
          <div class="flex gap-2">
            <button id="vq-again" class="btn btn-primary">New 10-Word Quiz</button>
            <button id="vq-back" class="btn">Back to Flashcards</button>
          </div>
        </div>
      `;
      box.querySelector('#vq-again').onclick = () => { startVocabQuiz(); renderVocabTrainer(box); };
      box.querySelector('#vq-back').onclick = () => { ui.vocabMode = 'flashcard'; renderVocabTrainer(box); };
      return;
    }
    const cur = vq.qs[vq.idx];
    const letters = ['A','B','C','D'];
    box.innerHTML = `
      <div class="surface-card p-6 max-w-2xl space-y-4">
        <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span class="font-bold tabular">Word ${vq.idx + 1} / ${vq.qs.length}</span>
          <button id="vq-exit" class="btn btn-sm">Flashcards</button>
        </div>
        <div class="text-base leading-relaxed font-medium">"${window.ApexUI.esc(cur.item.sat)}"</div>
        <div class="space-y-2">
          ${cur.choices.map((ch, i) => `
            <button class="choice-btn w-full ${vq.sel !== null ? (i === cur.answer ? 'correct' : i === vq.sel ? 'wrong' : '') : ''}" data-vq-ch="${i}" ${vq.sel !== null ? 'disabled' : ''}>
              <span class="choice-letter">${letters[i]}</span><span class="font-semibold">${window.ApexUI.esc(ch)}</span>
            </button>
          `).join('')}
        </div>
        ${vq.sel !== null ? `
          <div class="surface-subtle p-3.5 text-xs space-y-1">
            <div><strong>${window.ApexUI.esc(cur.item.word)}</strong> (${cur.item.pos}): ${window.ApexUI.esc(cur.item.def)}</div>
            <div class="text-[var(--muted-foreground)]">${window.ApexUI.esc(cur.item.nuance)}</div>
            <button id="vq-next" class="btn btn-primary btn-sm mt-2">${vq.idx === vq.qs.length - 1 ? 'See Score' : 'Next Word →'}</button>
          </div>
        ` : ''}
      </div>
    `;
    box.querySelector('#vq-exit').onclick = () => { ui.vocabMode = 'flashcard'; renderVocabTrainer(box); };
    box.querySelectorAll('[data-vq-ch]').forEach(b => {
      b.onclick = () => {
        vq.sel = Number(b.dataset.vqCh);
        if (vq.sel === cur.answer) vq.score++;
        renderVocabQuiz(box);
      };
    });
    const nxt = box.querySelector('#vq-next');
    if (nxt) nxt.onclick = () => {
      if (vq.idx >= vq.qs.length - 1) vq.done = true;
      else { vq.idx++; vq.sel = null; }
      renderVocabQuiz(box);
    };
  }

  /* --------------------------------------------------------------------------

    const ptsToGain = Math.max(0, (p.targetScore || 1600) - sc.total);

            </div>
            <button id="pl-save-btn" class="btn btn-primary">Update 1600 Roadmap</button>

        </div>

        <!-- 3-Phase Roadmap -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="surface-card p-5 space-y-2.5">

              <span class="section-kicker">Phase 1 · Weeks 1–${p1Weeks}</span>
              <span class="tag">Floor Lock (1480+)</span>
            </div>
            <h3 class="text-base font-bold m-0">Eliminate Free Points Lost</h3>
            <ul class="text-xs text-[var(--muted-foreground)] space-y-1.5 pl-4 m-0">
              <li>Master all 12 Grammar &amp; Punctuation rules until Conventions hits 95%+ accuracy in &lt;42s/Q.</li>

          <div class="surface-card p-5 space-y-2.5">

  /* --------------------------------------------------------------------------
     VIEW 7: FRIENDS HUB — SEEDED DUELS, SQUAD LEADERBOARD & SHARE/SYNC
     -------------------------------------------------------------------------- */
  function renderFriends(stage) {
    const st = window.ApexStore.get();
    const myCardCode = window.ApexStore.makePlayerCardCode();
    const sc = window.ApexStore.getProjectedScores();
    const myBestMock = st.exams.length ? Math.max(...st.exams.map(e => e.totalScore || 0)) : 0;

    // Combine self + squad sorted by projected score
    const board = [
      { name: `${st.profile.name} (You)`, projected: sc.total, rw: sc.rw, math: sc.math, bestMock: myBestMock, streak: st.streak.count, solved: st.stats.totalSolved, isMe: true },
      ...st.squad
    ].sort((a, b) => b.projected - a.projected);

    stage.innerHTML = `
      <div class="space-y-6">
        <div class="pb-4 border-b border-[var(--border)]">
          <div class="section-kicker">Multiplayer Without Servers</div>
          <h1 class="page-title mt-1">Friends Hub — Duels, Squad &amp; Sharing</h1>
          <p class="text-sm text-[var(--muted-foreground)] mt-1 mb-0">Challenge your friends to the exact same SAT questions via deterministic seed codes, compare head-to-head times, and track your study squad.</p>
        </div>

        <!-- Seeded Friend Duels -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="surface-card p-5 space-y-3">
            <div class="section-kicker">Start a Seeded Friend Duel</div>
            <p class="text-xs text-[var(--muted-foreground)] m-0">Complete a sprint to generate a compact <code class="font-mono">APEXDUEL:...</code> code. Send it to friends — they get the <strong>exact same questions</strong> and see a head-to-head scorecard!</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
              <button class="btn btn-primary btn-sm" data-new-duel="mixed:12:1600 Mixed Boss Duel">Mixed 12Q</button>
              <button class="btn btn-sm" data-new-duel="math:10:1600 Math Sprint">Math 10Q</button>
              <button class="btn btn-sm" data-new-duel="rw:10:1600 RW Sprint">RW 10Q</button>
            </div>
          </div>

          <div class="surface-card p-5 space-y-3">
            <div class="section-kicker">Accept a Friend's Challenge Code</div>
            <div class="flex gap-2">
              <input id="fr-duel-code" type="text" class="field-input font-mono text-xs" value="${window.ApexUI.esc(ui.pendingChallengeCode || '')}" placeholder="Paste APEXDUEL:... code from your friend" />
              <button id="fr-accept-duel" class="btn btn-primary shrink-0">Accept Duel</button>
            </div>
            <div class="text-xs text-[var(--muted-foreground)]">Works 100% offline using deterministic question seeding — no accounts or servers required.</div>
          </div>
        </div>

        <!-- Squad Leaderboard -->
        <div class="surface-card p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="section-kicker">Study Squad Leaderboard</div>
              <div class="text-xs text-[var(--muted-foreground)] mt-0.5">Share your Player Card code in your group chat and paste friends' codes below.</div>
            </div>
            <button id="fr-copy-card" class="btn btn-primary btn-sm">Copy My Player Card Code</button>
          </div>

          <div class="flex gap-2">
            <input id="fr-add-card-inp" type="text" class="field-input font-mono text-xs" placeholder="Paste a friend's APEXCARD:... code to add or update them on your leaderboard" />
            <button id="fr-add-card-btn" class="btn shrink-0">Add Friend</button>
          </div>

          <div class="overflow-x-auto">
            <table class="sat-table">
              <thead><tr><th>Rank</th><th>Scholar</th><th>Projected</th><th>Split (RW / Math)</th><th>Best Mock</th><th>Streak</th><th>Solved</th><th></th></tr></thead>
              <tbody>
                ${board.map((row, i) => `
                  <tr style="${row.isMe ? 'font-weight:600' : ''}">
                    <td class="tabular">#${i + 1}</td>
                    <td>${window.ApexUI.esc(row.name)}</td>
                    <td class="font-bold tabular">${row.projected}</td>
                    <td class="tabular">${row.rw} / ${row.math}</td>
                    <td class="tabular">${row.bestMock || '—'}</td>
                    <td class="tabular">${row.streak}d</td>
                    <td class="tabular">${row.solved}</td>
                    <td>${row.isMe ? '' : `<button class="btn btn-sm" data-rm-squad="${window.ApexUI.esc(row.name)}">Remove</button>`}</td>

            </table>
          </div>
        </div>

        <!-- Recent Duels -->
        ${st.duels.length > 0 ? `
          <div class="surface-card p-5 space-y-2.5">
            <div class="section-kicker">Recent Duels (${st.duels.length})</div>
            <div class="space-y-2">
              ${st.duels.slice(0, 8).map(d => `
                <div class="surface-subtle p-3 flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div>
                    <span class="font-bold">${window.ApexUI.esc(d.title)}</span>
                    <span class="text-[var(--muted-foreground)] ml-2">${d.date}</span>
                    <div class="mt-0.5 tabular">
                      You: <strong>${d.myScore}/${d.total}</strong> (${window.ApexUI.formatTime(d.mySec)})
                      ${d.opponent ? ` vs ${window.ApexUI.esc(d.opponent)}: <strong>${d.oppScore}/${d.total}</strong> (${window.ApexUI.formatTime(d.oppSec)})` : ' · Waiting for challenger'}
                    </div>
                  </div>
                  <button class="btn btn-sm" data-recopy-duel="${window.ApexUI.esc(d.code)}">Copy Code</button>

              `).join('')}

          </div>
        ` : ''}

        <!-- Share & Backup Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="surface-card p-5 space-y-3">
            <div class="section-kicker">Portable Progress Backup &amp; Sync</div>
            <p class="text-xs text-[var(--muted-foreground)] m-0">Move all your scores, Mistake Vault, Vocab SRS, and Squad between laptop and phone anytime.</p>
            <div class="flex flex-wrap gap-2">
              <button id="fr-export-json" class="btn btn-sm">Download Backup (.json)</button>
              <label class="btn btn-sm cursor-pointer">Import Backup (.json)<input id="fr-import-json" type="file" accept=".json" class="hidden" /></label>
              <button id="fr-reset-all" class="btn btn-sm">Reset Profile</button>
            </div>
          </div>

          <div class="surface-card p-5 space-y-2">
            <div class="section-kicker">How to Share APEX 1600 With Friends</div>
            <ol class="text-xs text-[var(--muted-foreground)] space-y-1 pl-4 m-0">
              <li>Send the single <code class="font-mono">SAT_1600_Studio.html</code> file via AirDrop, Discord, email, or Google Drive — friends just double-click to open in Chrome, Safari, or Edge (works offline!).</li>
              <li>Want a permanent link? Drag-and-drop <code class="font-mono">SAT_1600_Studio.html</code> onto Netlify Drop or GitHub Pages for a free shareable URL.</li>
              <li>Swap <code class="font-mono">APEXDUEL</code> and <code class="font-mono">APEXCARD</code> codes in your group chat to race toward 1600 together!</li>
            </ol>
          </div>
        </div>
      </div>
    `;

    stage.querySelectorAll('[data-new-duel]').forEach(btn => {
      btn.onclick = () => {
        const [duelType, countStr, title] = btn.dataset.newDuel.split(':');
        window.ExamRunner.start('duel', { duelType, count: Number(countStr), title });
      };
    });

    stage.querySelector('#fr-accept-duel').onclick = () => {
      const raw = stage.querySelector('#fr-duel-code').value.trim();
      try {
        const p = window.ApexStore.parseChallengeCode(raw);
        ui.pendingChallengeCode = '';
        window.ExamRunner.start('duel', {
          seed: p.seed,
          duelType: p.mode,
          count: p.count,
          title: p.title || 'Friend Duel',
          opponent: p.author || 'Friend',
          oppScore: p.score,
          oppSec: p.sec
        });
      } catch (e) {
        window.ApexUI.toast(e.message || 'Invalid Challenge Code');
      }
    };

    stage.querySelector('#fr-copy-card').onclick = () => {
      window.ExamRunner.copyToClipboard(myCardCode, 'Player Card code copied! Send to friends to add you to their Squad Leaderboard.');
    };

    stage.querySelector('#fr-add-card-btn').onclick = () => {
      const raw = stage.querySelector('#fr-add-card-inp').value.trim();
      try {
        const card = window.ApexStore.parsePlayerCardCode(raw);
        const idx = st.squad.findIndex(x => x.name.toLowerCase() === card.name.toLowerCase());
        if (idx >= 0) st.squad[idx] = card;
        else st.squad.push(card);
        window.ApexStore.save();
        window.ApexUI.toast(`${card.name} (${card.projected}) added to Squad!`);
        renderFriends(stage);
      } catch (e) {
        window.ApexUI.toast(e.message || 'Invalid Player Card code');
      }
    };

    stage.querySelectorAll('[data-rm-squad]').forEach(btn => {
      btn.onclick = () => {
        st.squad = st.squad.filter(x => x.name !== btn.dataset.rmSquad);
        window.ApexStore.save();
        renderFriends(stage);
      };
    });

    stage.querySelectorAll('[data-recopy-duel]').forEach(btn => {
      btn.onclick = () => window.ExamRunner.copyToClipboard(btn.dataset.recopyDuel, 'Challenge Code copied!');
    });

    stage.querySelector('#fr-export-json').onclick = () => {
      const blob = new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `apex1600_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      window.ApexUI.toast('Backup downloaded.');
    };

    stage.querySelector('#fr-import-json').onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || !parsed.profile) throw new Error('Invalid backup file');
          window.ApexStore.set(parsed);
          window.ApexUI.toast('Backup restored successfully!');
          render();
        } catch {
          window.ApexUI.toast('Could not parse backup JSON.');
        }
      };
      reader.readAsText(file);
    };

    stage.querySelector('#fr-reset-all').onclick = () => {
      window.ApexUI.openModal('Reset All Progress?', `
        <p class="text-sm text-[var(--muted-foreground)] mt-0">This clears your local scores, Mistake Vault, Vocab SRS, and Squad. Download a JSON backup first if you want to keep it.</p>
        <div class="flex justify-end gap-2 mt-4">
          <button id="rst-no" class="btn">Cancel</button>
          <button id="rst-yes" class="btn btn-primary">Reset Everything</button>
        </div>
      `, (root, close) => {
        root.querySelector('#rst-no').onclick = close;
        root.querySelector('#rst-yes').onclick = () => { window.ApexStore.reset(); close(); window.ApexUI.toast('Profile reset.'); render(); };
      });
    };
  }

  return { init, render, openSaveModal };
})();

document.addEventListener('DOMContentLoaded', () => window.ApexApp.init());
</script>

<script>
(function(){
  const saved = localStorage.getItem('apex_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.classList.remove('hidden');
      const sync = () => { btn.textContent = document.documentElement.classList.contains('dark') ? 'Light' : 'Dark'; };
      sync();
      btn.onclick = () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('apex_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        sync();
        window.dispatchEvent(new Event('themechange'));
      };
    }
  });
})();
</script>
